# spawns. Shadow mode by default (detects + alerts, never blocks) — see the
# script's own header for the staged-rollout rationale.
pre_start = ["/Users/athos/gt/.gascity-gastown-hq/scripts/claude-credential-preflight.sh"]

[[patches.agent]]
dir = ""
name = "gastown.boot"
suspended = true
# ga-tkd2ll: see gastown.mayor's identical entry above for rationale.
pre_start = ["/Users/athos/gt/.gascity-gastown-hq/scripts/claude-credential-preflight.sh"]
# ga-4kxdc: boot is autonomous/non-human-attended (spawned by deacon's patrol
# cycle), not mayor and not a named crew member, so per Athos's 2026-08-30
# policy ("so o mayor e crew members deveriam ter" Remote Control) it must be
