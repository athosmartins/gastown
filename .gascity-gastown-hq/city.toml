[workspace]
provider = "claude"
global_fragments = ["command-glossary", "operational-awareness", "town-deltas"]

[providers]
[providers.claude]
base = "builtin:claude"
ready_delay_ms = 0
[providers.claude-headless]
base = "builtin:claude"
args_append = ["--settings", "{\"remoteControlAtStartup\":false}", "--model", "sonnet"]
ready_delay_ms = 0

[imports]
[imports.gastown]
source = ".gc/system/packs/gastown"
[imports.town-deltas]
source = "packs/town-deltas"

[[rigs]]
name = "property_scrapers"
prefix = "ps"

[[rigs]]
name = "marketing"
prefix = "ma"
default_branch = "main"
suspended = true

[[rigs]]
name = "lexbh"
prefix = "lx"
suspended = true

[[rigs]]
name = "gastown"
prefix = "gt"

[[rigs]]
name = "whatsapp_automation"
prefix = "wa"
default_branch = "main"

[[rigs]]
name = "deacon"
prefix = "dc"
suspended = true

[patches]

[[patches.agent]]
dir = ""
name = "gastown.mayor"
suspended = false

[[patches.agent]]
dir = ""
name = "gastown.boot"
suspended = true

[[patches.agent]]
dir = ""
name = "gastown.deacon"
suspended = true

[[patches.agent]]
dir = ""
name = "gastown.dog"
provider = "claude-headless"

[daemon]
formula_v2 = true
patrol_interval = "120s"
