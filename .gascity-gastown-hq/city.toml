[workspace]
provider = "claude"
global_fragments = ["command-glossary", "operational-awareness", "town-deltas"]

[providers]
[providers.claude]
base = "builtin:claude"
ready_delay_ms = 0
[providers.claude-headless]
base = "builtin:claude"
args_append = ["--settings", "{\"remoteControlAtStartup\":false}", "--model", "sonnet"]
ready_delay_ms = 0

[imports]
[imports.gastown]
source = ".gc/system/packs/gastown"
[imports.town-deltas]
source = "packs/town-deltas"

[[rigs]]
name = "property_scrapers"
prefix = "ps"

[[rigs]]
name = "marketing"
prefix = "ma"
default_branch = "main"
suspended = true

[[rigs]]
name = "lexbh"
prefix = "lx"
suspended = true

[[rigs]]
name = "gastown"
prefix = "gt"

[[rigs]]
name = "whatsapp_automation"
prefix = "wa"
default_branch = "main"

[[rigs]]
name = "deacon"
prefix = "dc"
suspended = true

[patches]

[[patches.agent]]
dir = ""
name = "gastown.mayor"
suspended = false

[[patches.agent]]
dir = ""
name = "gastown.boot"
suspended = true

[[patches.agent]]
dir = ""
name = "gastown.deacon"
suspended = true

[[patches.agent]]
dir = ""
name = "gastown.dog"
provider = "claude-headless"
# gt-fppb0: reclaim PROVABLY-DEAD dog-pool claims before this fresh dog runs
# `gc hook`, so its Tier-1 work_query (bd list --status in_progress --assignee
# gastown.dog) can't re-adopt a dead claimant's zombie and burn in a respawn
# loop. Fast + FAIL-OPEN (SIGALRM budget + catch-all → always exit 0); it never
# blocks a spawn. inflight-reclaim-guard's poll is the authoritative backstop.
pre_start = ["/Users/athos/gt/.gascity-gastown-hq/scripts/dog-pool-preflight-reclaim.py"]

# BEGIN ga-23z6a eval-window-concurrency-guard (managed by
# packs/town-deltas/assets/scripts/eval-window-concurrency-guard.sh — do not
# hand-edit the two value lines below; the guard rewrites them in place when a
# window opens/closes and always follows with `gc reload --soft`. Values here
# are the NORMAL (outside-window) profile, matching each agent's un-patched
# default (confirmed via `gc config explain`) — see the guard script header
# for the 3 named window schedules and the full ga-sb11i.2 rationale.
# Log: .gc/logs/eval-window-concurrency-guard.log
# Note: the oracle-wa patch only resolves once oracle-wa itself is defined,
# which today comes from this rig's own (pre-existing, uncommitted) root
# pack.toml, not from any git-tracked source — a real gap, but predates this
# story and applies to every reference to oracle-wa, not just this one.
[[patches.agent]]
name = "gastown.dog"
max_active_sessions = 3

[[patches.agent]]
name = "oracle-wa"
min_active_sessions = 1
# END ga-23z6a eval-window-concurrency-guard

[daemon]
# nudge_dispatcher: EXPLICITAMENTE "legacy" — nao remova sem MEDIR (ga-yxuab).
# O modo runtime (socket wake) e melhor no papel: o poll `gc nudge poll` por sessao
# batendo no Dolt a cada 2s era ~48% da carga do plano de dados. Eu LIGUEI o runtime
# em 05/08 depois de ler a fonte, MEDI, e os nudges NAO chegavam (>3min). Causa: o
# binario gc em uso foi compilado 48s ANTES do arquivo-fonte mudar — ou seja, a fonte
# prometia um comportamento que o binario que roda nao tem.
# Reverti pra legacy e e por isso que a linha e EXPLICITA: omitir cai no default, e o
# default pode religar silenciosamente um modo que este binario nao implementa.
# PRA VOLTAR A TENTAR: rebuild do gc, confirmar mtime do binario > mtime da fonte, e so
# entao trocar. Teste de aceite falsificavel: sessao VIVA e SEM poller + gc session nudge
# + LAST NUDGE muda em < patrol_interval. Sessao COM poller entrega pelo caminho legacy
# e da FALSO-POSITIVO.
nudge_dispatcher = "legacy"

formula_v2 = true
patrol_interval = "120s"

# max_wakes_per_tick: 5 -> 2 (ga-nawd3, 2026-08-07). Root cause: the reconciler's
# per-tick wake budget was uncapped enough (default 5) that a mass respawn (5
# crew sessions all reset to open+unassigned within ~36s, after an operator
# mistakenly killed 7 crew sessions) fit inside a SINGLE tick and fired fully
# concurrently — 0s spacing between them (session_lifecycle logs: all 5 in
# wave=0, each taking 22-25s wall time with an 8-12s Dolt-heavy
# post_start_observe phase). Dolt entered ~8min of congestive collapse
# (30-74s queries, 47 ESTABLISHED connections). This is not specific to that
# one trigger — ANY cause of mass respawn (machine reboot, supervisor
# restart, crash recovery) hits the same uncapped-concurrency path.
#
# This value caps how many sessions may start CONCURRENTLY within one tick;
# excess candidates wait for the next tick rather than piling onto Dolt at
# once. It does not add a sleep/stagger inside a tick (that requires an
# engine-Go change — see the session_lifecycle_parallel.go spawn loop; out of
# scope for a config-only fix, tracked separately).
#
# TRADE-OFF (honest, from config.go's own documented formula: wall time to
# wake N sessions is roughly ceil(N/max_wakes_per_tick) * patrol_interval,
# and patrol_interval is 120s in THIS city, not the code's 30s default):
# a legitimate multi-session cold start (machine reboot, `gc start`) now
# takes proportionally longer to fully wake the pool — e.g. 5 candidates
# spread across ceil(5/2)=3 ticks instead of 1, up to ~4min (240s) for the
# last straggler instead of ~0s. Chosen as a deliberate trade: bounding peak
# concurrent Dolt-heavy boots to 2 (down from 5, a 60% cut) is worth a slower
# worst-case cold start, given the alternative already observed once is an
# ~8min citywide Dolt outage. NOT touching patrol_interval itself — poll/
# patrol frequency is a separately-documented historical root cause of Dolt
# CPU pressure in this city; shortening it to compensate would trade one
# known risk for a re-run of a different one.
#
# Does NOT fix: true per-spawn stagger within a tick (Go engine change,
# refused by dog doctrine — pool:refused:engine-rebuild-required). Follow-up
# tracked for that half of the fix.
max_wakes_per_tick = 2
