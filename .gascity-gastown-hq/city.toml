[[patches.agent]]
dir = ""
name = "gastown.deacon"
suspended = true
# ga-tkd2ll: see gastown.mayor's identical entry above for rationale.
pre_start = ["/Users/athos/gt/.gascity-gastown-hq/scripts/claude-credential-preflight.sh"]
# ga-4kxdc: deacon is an autonomous heartbeat/patrol singleton, not mayor and
# not a named crew member, so per Athos's 2026-08-30 policy it must be
# headless too — it had no RC-off protection (confirmed via `gc config show`:
# no provider field resolved for it, unlike gastown.dog/wa-worker/ps-worker).
provider = "claude-headless"
# wa-cy6we: same overlay_dir fix as gastown.boot above — provider's --settings
# flag alone isn't documented as reliably beating the global default.
overlay_dir = "packs/town-deltas/assets/claude-overlays/pool"

[[patches.agent]]
dir = ""
name = "gastown.dog"
provider = "claude-headless"
# gt-fppb0: reclaim PROVABLY-DEAD dog-pool claims before this fresh dog runs
# `gc hook`, so its Tier-1 work_query (bd list --status in_progress --assignee
# gastown.dog) can't re-adopt a dead claimant's zombie and burn in a respawn
# loop. Fast + FAIL-OPEN (SIGALRM budget + catch-all → always exit 0); it never
# blocks a spawn. inflight-reclaim-guard's poll is the authoritative backstop.
# ga-tkd2ll: also verify the Claude Code credential is usable before spawn.
# Shadow mode by default (detects + alerts, never blocks) — see the script's
# own header for the staged-rollout rationale.
pre_start = [
  "/Users/athos/gt/.gascity-gastown-hq/scripts/dog-pool-preflight-reclaim.py",
  "/Users/athos/gt/.gascity-gastown-hq/scripts/claude-credential-preflight.sh",
]

# BEGIN ga-23z6a eval-window-concurrency-guard (managed by
# packs/town-deltas/assets/scripts/eval-window-concurrency-guard.sh — do not
# hand-edit the two value lines below; the guard rewrites them in place when a
# window opens/closes and always follows with `gc reload --soft`. Values here
# are the NORMAL (outside-window) profile, matching each agent's un-patched
# default (confirmed via `gc config explain`) — see the guard script header
# for the 3 named window schedules and the full ga-sb11i.2 rationale.
# Log: .gc/logs/eval-window-concurrency-guard.log
# Note: the oracle-wa patch only resolves once oracle-wa itself is defined,
# which today comes from this rig's own (pre-existing, uncommitted) root
# pack.toml, not from any git-tracked source — a real gap, but predates this
# story and applies to every reference to oracle-wa, not just this one.
[[patches.agent]]
name = "gastown.dog"
max_active_sessions = 6

[[patches.agent]]
name = "oracle-wa"
min_active_sessions = 1
# END ga-23z6a eval-window-concurrency-guard

# ga-hnn7l: pool sessions (dog/wa-worker/ps-worker) get zero scoped
# .claude/settings.json today, so Athos's global "ask" rule for
# Bash(rm -rf:*)/Bash(sudo:*) can deadlock an unsupervised session forever
# (ga-q640n P0 — a dog froze 7h on a harmless __pycache__ cleanup). Athos's
# decision (2026-08-18, multiple-choice): deny both, scoped to pool roles
# only — his own interactive ask rule is untouched.
# overlay_dir is copied into each session's workdir at spawn time and
# JSON-merges into .claude/settings.json (internal/overlay/merge.go
# mergeablePaths); deny wins over ask regardless of which scope contributed
# either rule, so this shadows the global ask for pool sessions only.
# Path confirmed to resolve via realizePoolDesiredSessions ->
# resolveTemplateForSessionBead -> prepareTemplateResolution ->
# materializeProviderOverlaysBeforeFingerprint (cmd/gc/build_desired_state.go).
# wa-cy6we (Athos, 2026-08-30): this same overlay file now ALSO carries
# "remoteControlAtStartup": false. The claude-headless PROVIDER's --settings
# flag (used by dog/gate-reviewer/wa-worker/ps-worker/etc.) was not reliably
# beating the global ~/.claude/settings.json remoteControlAtStartup=true — the
# docs don't specify precedence between two --settings CLI flags racing on the
# same command line, and Athos confirmed live that RC was still auto-connecting
# for gate reviewers and dogs despite provider=claude-headless being set. This
# overlay path IS documented as reliable (settings.md, "Exceptions to managed
# settings precedence": a false from .claude/settings.json or
# .claude/settings.local.json wins even over a managed/global true) — every
# agent using this overlay_dir now gets remoteControlAtStartup:false via the
# guaranteed path, not just the permission-deny rules.
[[patches.agent]]
name = "gastown.dog"
overlay_dir = "packs/town-deltas/assets/claude-overlays/pool"

[[patches.agent]]
name = "wa-worker"
overlay_dir = "packs/town-deltas/assets/claude-overlays/pool"

[[patches.agent]]
name = "ps-worker"
overlay_dir = "packs/town-deltas/assets/claude-overlays/pool"

# ga-kjncp: long-lived roles (mayor, oracle, persistent crews) pay their
# context cost in TURNS, not once — every turn resends the whole conversation,
# so cost is average-context-size x turn-count, not final window size. The
# 26/08 cost spike (ga-w6vbc) measured Oracle's own session at 1,748 turns /
# 13 compactions (auto-compact only fires reactively, near ~967K tokens for
# Sonnet 5's 1M window) -> average ~572K tokens/turn. Lowering the threshold
# to 300K (still inside Claude Code's documented 100K-1M valid range for
# EVERY model, so this is a safe no-op for any smaller-context model that
# already compacts earlier out of necessity) drops the same session to an
# estimated ~225K tokens/turn average -- ~60% less -- for a projected
# compaction-overhead cost of ~22M extra tokens against ~600M saved (noise
# by comparison). Pool roles already avoid this by doctrine (short sessions,
# "find work -> execute -> exit") and are excluded here on purpose: applying
# a lower threshold to them would be harmless but is not the driver (~72% of
# measured cache-read volume comes from long-lived roles' in-session growth,
# not the short-lived pool).
# Tradeoff (not eliminated by this change, only bounded): Anthropic's docs do
# not publish a quality/coherence cost for more frequent compaction -- treat
# this as a monitored change, not a proven-safe one. If a long-lived role
# starts visibly losing the thread of multi-hour work, that is the signal to
# raise this number back up, not proof the whole approach is wrong.
# Mechanism: overlay_dir stages .claude/settings.json's autoCompactWindow key
# (Anthropic's documented settings.json equivalent of --autocompact) into
# each session's workdir at spawn time, same JSON-merge path already proven
# by the pool overlay above (internal/overlay/merge.go). Takes effect on each
# role's NEXT session launch -- does not force-restart any currently-running
# mayor/oracle/crew session.
[[patches.agent]]
name = "gastown.mayor"
overlay_dir = "packs/town-deltas/assets/claude-overlays/longlived"

[[patches.agent]]
name = "oracle-wa"
overlay_dir = "packs/town-deltas/assets/claude-overlays/longlived"

[[patches.agent]]
name = "mila-wa"
overlay_dir = "packs/town-deltas/assets/claude-overlays/longlived"

[[patches.agent]]
name = "batista-wa"
overlay_dir = "packs/town-deltas/assets/claude-overlays/longlived"

[[patches.agent]]
name = "digo-wa"
overlay_dir = "packs/town-deltas/assets/claude-overlays/longlived"

[[patches.agent]]
name = "thies-wa"
overlay_dir = "packs/town-deltas/assets/claude-overlays/longlived"

[[patches.agent]]
name = "peter-wa"
overlay_dir = "packs/town-deltas/assets/claude-overlays/longlived"

[daemon]
# nudge_dispatcher: EXPLICITAMENTE "legacy" — nao remova sem MEDIR (ga-yxuab).
# O modo runtime (socket wake) e melhor no papel: o poll `gc nudge poll` por sessao
# batendo no Dolt a cada 2s era ~48% da carga do plano de dados. Eu LIGUEI o runtime
# em 05/08 depois de ler a fonte, MEDI, e os nudges NAO chegavam (>3min). Causa: o
# binario gc em uso foi compilado 48s ANTES do arquivo-fonte mudar — ou seja, a fonte
# prometia um comportamento que o binario que roda nao tem.
# Reverti pra legacy e e por isso que a linha e EXPLICITA: omitir cai no default, e o
# default pode religar silenciosamente um modo que este binario nao implementa.
# PRA VOLTAR A TENTAR: rebuild do gc, confirmar mtime do binario > mtime da fonte, e so
# entao trocar. Teste de aceite falsificavel: sessao VIVA e SEM poller + gc session nudge
# + LAST NUDGE muda em < patrol_interval. Sessao COM poller entrega pelo caminho legacy
# e da FALSO-POSITIVO.
nudge_dispatcher = "legacy"

formula_v2 = true
patrol_interval = "120s"

# max_wakes_per_tick: 5 -> 2 (ga-nawd3, 2026-08-07). Root cause: the reconciler's
# per-tick wake budget was uncapped enough (default 5) that a mass respawn (5
# crew sessions all reset to open+unassigned within ~36s, after an operator
# mistakenly killed 7 crew sessions) fit inside a SINGLE tick and fired fully
# concurrently — 0s spacing between them (session_lifecycle logs: all 5 in
# wave=0, each taking 22-25s wall time with an 8-12s Dolt-heavy
# post_start_observe phase). Dolt entered ~8min of congestive collapse
# (30-74s queries, 47 ESTABLISHED connections). This is not specific to that
# one trigger — ANY cause of mass respawn (machine reboot, supervisor
# restart, crash recovery) hits the same uncapped-concurrency path.
#
# This value caps how many sessions may start CONCURRENTLY within one tick;
# excess candidates wait for the next tick rather than piling onto Dolt at
# once. It does not add a sleep/stagger inside a tick (that requires an
# engine-Go change — see the session_lifecycle_parallel.go spawn loop; out of
# scope for a config-only fix, tracked separately).
#
# TRADE-OFF (honest, from config.go's own documented formula: wall time to
# wake N sessions is roughly ceil(N/max_wakes_per_tick) * patrol_interval,
# and patrol_interval is 120s in THIS city, not the code's 30s default):
# a legitimate multi-session cold start (machine reboot, `gc start`) now
# takes proportionally longer to fully wake the pool — e.g. 5 candidates
# spread across ceil(5/2)=3 ticks instead of 1, up to ~4min (240s) for the
# last straggler instead of ~0s. Chosen as a deliberate trade: bounding peak
# concurrent Dolt-heavy boots to 2 (down from 5, a 60% cut) is worth a slower
# worst-case cold start, given the alternative already observed once is an
# ~8min citywide Dolt outage. NOT touching patrol_interval itself — poll/
# patrol frequency is a separately-documented historical root cause of Dolt
# CPU pressure in this city; shortening it to compensate would trade one
# known risk for a re-run of a different one.
#
# Does NOT fix: true per-spawn stagger within a tick (Go engine change,
# refused by dog doctrine — pool:refused:engine-rebuild-required). Follow-up
# tracked for that half of the fix.
max_wakes_per_tick = 2

