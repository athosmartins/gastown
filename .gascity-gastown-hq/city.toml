[workspace]
provider = "claude"
global_fragments = ["command-glossary", "operational-awareness", "town-deltas"]

[providers]
[providers.claude]
base = "builtin:claude"
ready_delay_ms = 0
[providers.claude-headless]
base = "builtin:claude"
args_append = ["--settings", "{\"remoteControlAtStartup\":false}", "--model", "sonnet"]
ready_delay_ms = 0

[imports]
[imports.gastown]
source = ".gc/system/packs/gastown"
[imports.town-deltas]
source = "packs/town-deltas"

[[rigs]]
name = "property_scrapers"
prefix = "ps"

[[rigs]]
name = "marketing"
prefix = "ma"
default_branch = "main"
suspended = true

[[rigs]]
name = "lexbh"
prefix = "lx"
suspended = true

[[rigs]]
name = "gastown"
prefix = "gt"

[[rigs]]
name = "whatsapp_automation"
prefix = "wa"
default_branch = "main"

[[rigs]]
name = "deacon"
prefix = "dc"
suspended = true

[patches]

[[patches.agent]]
dir = ""
name = "gastown.mayor"
suspended = false

[[patches.agent]]
dir = ""
name = "gastown.boot"
suspended = true

[[patches.agent]]
dir = ""
name = "gastown.deacon"
suspended = true

[[patches.agent]]
dir = ""
name = "gastown.dog"
provider = "claude-headless"
# gt-fppb0: reclaim PROVABLY-DEAD dog-pool claims before this fresh dog runs
# `gc hook`, so its Tier-1 work_query (bd list --status in_progress --assignee
# gastown.dog) can't re-adopt a dead claimant's zombie and burn in a respawn
# loop. Fast + FAIL-OPEN (SIGALRM budget + catch-all → always exit 0); it never
# blocks a spawn. inflight-reclaim-guard's poll is the authoritative backstop.
pre_start = ["/Users/athos/gt/.gascity-gastown-hq/scripts/dog-pool-preflight-reclaim.py"]

# BEGIN ga-23z6a eval-window-concurrency-guard (managed by
# packs/town-deltas/assets/scripts/eval-window-concurrency-guard.sh — do not
# hand-edit the two value lines below; the guard rewrites them in place when a
# window opens/closes and always follows with `gc reload --soft`. Values here
# are the NORMAL (outside-window) profile, matching each agent's un-patched
# default (confirmed via `gc config explain`) — see the guard script header
# for the 3 named window schedules and the full ga-sb11i.2 rationale.
# Log: .gc/logs/eval-window-concurrency-guard.log
# Note: the oracle-wa patch only resolves once oracle-wa itself is defined,
# which today comes from this rig's own (pre-existing, uncommitted) root
# pack.toml, not from any git-tracked source — a real gap, but predates this
# story and applies to every reference to oracle-wa, not just this one.
[[patches.agent]]
name = "gastown.dog"
max_active_sessions = 3

[[patches.agent]]
name = "oracle-wa"
min_active_sessions = 1
# END ga-23z6a eval-window-concurrency-guard

[daemon]
# nudge_dispatcher: EXPLICITAMENTE "legacy" — nao remova sem MEDIR (ga-yxuab).
# O modo runtime (socket wake) e melhor no papel: o poll `gc nudge poll` por sessao
# batendo no Dolt a cada 2s era ~48% da carga do plano de dados. Eu LIGUEI o runtime
# em 05/08 depois de ler a fonte, MEDI, e os nudges NAO chegavam (>3min). Causa: o
# binario gc em uso foi compilado 48s ANTES do arquivo-fonte mudar — ou seja, a fonte
# prometia um comportamento que o binario que roda nao tem.
# Reverti pra legacy e e por isso que a linha e EXPLICITA: omitir cai no default, e o
# default pode religar silenciosamente um modo que este binario nao implementa.
# PRA VOLTAR A TENTAR: rebuild do gc, confirmar mtime do binario > mtime da fonte, e so
# entao trocar. Teste de aceite falsificavel: sessao VIVA e SEM poller + gc session nudge
# + LAST NUDGE muda em < patrol_interval. Sessao COM poller entrega pelo caminho legacy
# e da FALSO-POSITIVO.
nudge_dispatcher = "legacy"

formula_v2 = true
patrol_interval = "120s"
