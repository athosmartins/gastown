description = """
Gate-done work formula — read the bead, work on a feature branch, submit via gate.

This is the standard work lifecycle for pool workers in the contained city model.
The worker creates a safe feature branch, implements the fix, pushes, and submits
via gate-done. The autonomous quality gate (G) dispatches independent reviewers,
merges to main on pass, and closes the source bead. The worker does NOT close the
bead or set gc.outcome=pass directly.

**Why gate-done (not direct close):**
- merge_strategy=direct bypasses reviewers and has caused silent drops (wa-n3tu).
- merge_strategy=mr stalls forever — no human clicks PRs in this city.
- Gate is the ONLY path to production. Worker closes nothing — G does.

## Branch naming rules (MANDATORY)
Branch names MUST match `[a-z0-9/_-]+` only.
- Use: `crew/<your-name>/<bead-id>` (e.g. `crew/batista/wa-xyz`)
- FORBIDDEN: `+`, uppercase, dots, spaces, or any other special characters.
- The gate guard rejects branches with unsafe chars (gate-status:error).

## Shared-root isolation (ga-xau4z)
If your CWD is the repo's single shared MAIN worktree (e.g. an HQ/gascity Dog
whose only checkout is the shared /Users/athos/gt tree) rather than an
already-isolated per-rig/per-agent worktree, step 2 automatically creates and
moves you into `.gc-worktrees/<bead>-<safe-name>` before branching. This stops
concurrent sessions on the same shared checkout from sweeping up each other's
uncommitted edits into one session's commit. The guard always resets the
branch to the latest `origin/main` inside the isolated worktree — whether it
was just created or is being reused from a prior attempt — so a redispatched
bead never silently builds on a stale base.

## Park path (ga-rswuxy)
Not every dispatched bead is fixable by code. Step 1 ends with an explicit
fork: if the real blocker is external (unmerged dependency, engine-window
gate, anything no code change on THIS bead resolves), the PARK PROCEDURE
there records the blocker, strips dispatch eligibility, and closes your own
sling — skipping steps 2-6 (branch/implement/push/gate) entirely. This is
the same park mechanics used city-wide, now enforced in the formula instead
of living only in individual agent judgment.

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| issue | caller | The STORY/bug bead you are fixing (e.g. `ga-xau4z`) — **NOT** your own ephemeral sling/task dispatch bead (e.g. `ga-e1yv1`, often available as `$GC_BEAD_ID`). Both are "assigned to this agent," but this formula's own step 5 writes `{{issue}}` directly into the gate marker's `bead_id`/`source-bead` fields when it creates the marker — a wrong `{{issue}}` corrupts those fields at that moment, independent of the branch name (see ga-pyxar). |
"""
formula = "mol-do-work"
version = 4

[vars]
[vars.issue]
description = "The STORY/bug bead you are fixing (e.g. ga-xau4z) — NOT your own ephemeral sling/task dispatch bead (e.g. ga-e1yv1, often available as $GC_BEAD_ID). Both are technically \"assigned to this agent,\" but this formula's own step 5 writes {{issue}} directly into the gate marker's bead_id/source-bead fields when it creates the marker — a wrong {{issue}} corrupts those fields at that moment, independent of the branch name (see ga-pyxar)."
required = true

[[steps]]
id = "do-work"
title = "Read assignment, implement on feature branch, submit via gate-done"
description = """
You have been assigned a work bead. Read it, create a feature branch,
implement the solution, push, submit via gate-done, and drain.

**DO NOT close the bead yourself. DO NOT set merge_strategy=direct or mr.
The gate (G) closes the bead after it merges to main.**

**1. Read your assignment:**
```bash
bd show {{issue}}
gc mail inbox                     # Check for context/handoff messages
```

Read the bead's title and description carefully. This is your task.

**Decide: build or park?**

If the real blocker is external — an unmerged dependency, an
engine-window-gated change, anything no code change on THIS bead can
resolve — park it instead of building: run the PARK PROCEDURE below, then
go straight to the drain step. Do not run steps 2-6 (the build path) —
no branch, no implementation, no gate marker.

If this is a normal code-level fix, skip the PARK PROCEDURE and continue
to step 2.

**PARK PROCEDURE (blocked on infra, not code):**

```bash
# === MOL-DO-WORK PARK PROCEDURE BEGIN (ga-rswuxy) ===
# Each mutating call below is guarded individually (mirrors this same
# file's isolation guard, ga-xau4z) — a chain with zero error checking
# between steps would let step 1 fail silently while steps 2-5 still ran,
# leaving {{issue}} permanently un-dispatchable (no blocker edge ever
# recorded) but with an audit trail — stripped labels, a park comment, a
# closed sling — indistinguishable from a real success (gate feedback,
# ga-rswuxy fix-attempt 1). Fail fast, say which step broke and what
# already happened, so a retry never redoes a step that already
# succeeded.

# 1. Record the real blocker as a self-healing dependency edge — {{issue}}
#    becomes dispatch-eligible again automatically once the blocker
#    closes, no manual unpark step needed. This edge is the whole park's
#    safety net — if it fails, stop before touching anything else.
bd dep <blocking-bead-id> --blocks {{issue}} \
  || { echo "FATAL: could not record <blocking-bead-id> as blocking {{issue}} — nothing else has run yet. Check <blocking-bead-id> was substituted with a real bead id (it's a manual placeholder, not a templated var) and retry step 1." >&2; exit 1; }

# 2. Strip auto-dispatch eligibility (comma-separated = one call).
bd label remove {{issue}} ctx:ready,exec:auto,story:in-flight \
  || { echo "FATAL: blocker edge on {{issue}} is recorded, but stripping ctx:ready/exec:auto/story:in-flight failed — do not re-run step 1, just retry this label removal." >&2; exit 1; }

# 3. Add the park label in the SAME pass as the strip above — order
#    matters: strip first kills immediate eligibility, add second survives
#    later re-arm sweeps.
bd label add {{issue}} pilot:no-auto-dispatch \
  || { echo "FATAL: {{issue}} has its blocker edge recorded and dispatch labels stripped, but adding pilot:no-auto-dispatch failed — do not re-run steps 1-2, just retry this label add." >&2; exit 1; }

# 4. Explain the block so the next reader doesn't redo this investigation.
bd comment {{issue}} "Parked on <blocking-bead-id>: <why it blocks, and why this is infra not code>." \
  || { echo "FATAL: {{issue}} is fully parked (edge + labels), but the explanatory comment failed to post — do not re-run steps 1-3, just retry this comment." >&2; exit 1; }

# 5. Close your own sling now — this step's park-path equivalent of what
#    step 6 does for the build path (mirrors it: same bead, same
#    gc.outcome/status/notes shape, different verdict).
if [ -n "${GC_BEAD_ID:-}" ] && [ "$GC_BEAD_ID" != "{{issue}}" ]; then
  bd update "$GC_BEAD_ID" --set-metadata gc.outcome=parked --status=closed \
    --notes "Parked {{issue}} on <blocking-bead-id>. No branch — blocked on infra, not code." \
    || { echo "FATAL: {{issue}} is fully parked (edge + labels + comment), but closing own sling $GC_BEAD_ID failed — {{issue}} itself is fine, but do not skip this: retry the close, or the sling churns back into the pool (the exact ga-mb253h bug this procedure exists to prevent)." >&2; exit 1; }
fi
# === MOL-DO-WORK PARK PROCEDURE END (ga-rswuxy) ===
```

PARK PROCEDURE done → go directly to the drain step (below this one). Do
not run steps 2-6.

**2. Create a safe feature branch (MANDATORY before any code change):**

`{{issue}}` here is the STORY/bug bead named in your task title (e.g. a task
titled "fix bug ga-xau4z: ..." means `{{issue}}` = `ga-xau4z`). It is NOT the
ephemeral sling/task bead Pilot created to dispatch you — that one is usually
your own `$GC_BEAD_ID` and gets closed separately in step 6, never branched on.
Getting this backwards silently corrupts the gate marker that step 5 below
creates — that step writes `{{issue}}` directly into the marker's
`bead_id`/`source-bead` fields, independent of the branch name (ga-pyxar):
the gate would try to close your already-closed sling bead and never close
the real bug, so Pilot keeps re-dispatching it forever.

Branch name MUST use only lowercase letters, digits, hyphens, underscores,
and slashes — NO '+', uppercase, dots, or special characters.

```bash
git fetch --prune origin
SAFE_NAME=$(echo "${GC_ALIAS:-worker}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9_-' '-' | sed 's/-*$//')
BRANCH="crew/${SAFE_NAME}/{{issue}}"
# Verify branch name is safe before creating it
if ! echo "$BRANCH" | grep -qE '^[a-z0-9/_-]+$'; then
  echo "ERROR: Branch name '$BRANCH' contains unsafe characters. Abort."
  exit 1
fi

# === MOL-DO-WORK ISOLATION GUARD BEGIN (ga-xau4z) ===
# Concurrent pool-worker sessions can share ONE working tree (every builder
# fixing HQ/gascity cd's into the same /Users/athos/gt checkout). Branching+
# editing+committing there lets one session's commit sweep up another's
# unrelated uncommitted edit (root cause of ga-xau4z). Detect the MAIN
# (shared) worktree via git's own topology — in the main worktree, --git-dir
# and --git-common-dir resolve to the same path; in any linked worktree
# (from `git worktree add`) they differ. A rig-registry path lookup can't do
# this for HQ: gascity's registered path is a SUBDIR of the git toplevel,
# never equal to it.
ISOLATED=0
GIT_DIR_RAW="$(git rev-parse --git-dir 2>/dev/null)"
GIT_COMMON_DIR_RAW="$(git rev-parse --git-common-dir 2>/dev/null)"
if [ -n "$GIT_DIR_RAW" ] && [ -n "$GIT_COMMON_DIR_RAW" ]; then
  GIT_DIR_ABS="$(cd "$GIT_DIR_RAW" 2>/dev/null && pwd -P)"
  GIT_COMMON_DIR_ABS="$(cd "$GIT_COMMON_DIR_RAW" 2>/dev/null && pwd -P)"
else
  GIT_DIR_ABS=""
  GIT_COMMON_DIR_ABS="not-comparable"
fi

if [ -n "$GIT_DIR_ABS" ] && [ "$GIT_DIR_ABS" = "$GIT_COMMON_DIR_ABS" ]; then
  SHARED_ROOT="$(pwd)"
  BEFORE_BRANCH="$(git branch --show-current)"
  BEAD="${BRANCH##*/}"
  WT="$SHARED_ROOT/.gc-worktrees/${BEAD}-${SAFE_NAME}"
  HOOKS="/tmp/empty-hooks"
  mkdir -p "$HOOKS" 2>/dev/null || true
  echo "ISOLATION GUARD: CWD is the shared main worktree — isolating into $WT"

  if [ -e "$WT/.git" ]; then
    cd "$WT" || { echo "FATAL: isolation guard could not enter existing worktree $WT" >&2; exit 1; }
  else
    # Clear stale admin metadata for any worktree dir removed without
    # `git worktree remove` (e.g. reaped) — otherwise git refuses to reuse
    # its branch, claiming the branch is "already used by worktree at ...".
    git -C "$SHARED_ROOT" worktree prune 2>/dev/null || true
    if ! git -C "$SHARED_ROOT" -c core.hooksPath="$HOOKS" worktree add "$WT" -b "$BRANCH" origin/main; then
      # -b requires $BRANCH not exist. It can already exist as an orphaned
      # local ref (prior attempt's worktree dir was removed, ref wasn't) —
      # attach that existing branch to the new worktree instead of failing.
      git -C "$SHARED_ROOT" -c core.hooksPath="$HOOKS" worktree add "$WT" "$BRANCH" \
        || { echo "FATAL: isolation guard could not create or attach a worktree at $WT for branch $BRANCH" >&2; exit 1; }
    fi
    cd "$WT" || { echo "FATAL: isolation guard created $WT but could not enter it" >&2; exit 1; }
  fi

  # Always reset the branch to the latest origin/main inside the isolated
  # worktree — restores the freshness guarantee the old unconditional
  # `git checkout -B "$BRANCH" origin/main` gave on every invocation, whether
  # this worktree was just created or is being reused/reattached from a
  # prior attempt. `checkout -B` on the branch you're already on refuses to
  # clobber conflicting uncommitted changes rather than silently discarding
  # them, so a resumed session's non-conflicting WIP survives the refresh.
  git -c core.hooksPath="$HOOKS" checkout -B "$BRANCH" origin/main \
    || { echo "FATAL: isolation guard could not reset $BRANCH to origin/main in $WT" >&2; exit 1; }

  ISOLATED=1

  # HARD INVARIANT: the shared root must still be on its original branch —
  # never leave it mid-checkout for another session to trip over.
  ROOT_BRANCH="$(git -C "$SHARED_ROOT" branch --show-current)"
  if [ "$ROOT_BRANCH" != "$BEFORE_BRANCH" ]; then
    echo "FATAL: shared root '$SHARED_ROOT' moved from '$BEFORE_BRANCH' to '$ROOT_BRANCH'." >&2
    echo "       Restore it: git -C '$SHARED_ROOT' checkout '$BEFORE_BRANCH'" >&2
    exit 1
  fi
  echo "  Isolated worktree ready: $(pwd) (shared root untouched on $ROOT_BRANCH)"

  # ga-ir033: if SHARED_ROOT was itself nested inside a larger repo (e.g. an
  # HQ/gascity Dog whose CWD is `.gascity-gastown-hq`, a tracked SUBDIR of the
  # true git toplevel `/Users/athos/gt`, not a repo boundary of its own), the
  # worktree just created above is a FULL checkout of that same outer repo —
  # so it ALSO contains that same nesting one level down, e.g.
  # `$WT/.gascity-gastown-hq/`. Landing the shell at $WT (the worktree's own
  # outer boundary) leaves "which directory is really city-root" to be
  # re-derived by hand later — exactly the mistake that produced a
  # double-prefixed ghost file the gate reviewed but never deployed (see
  # git-worktree-nested-city-path-prefix-gotcha). Compute the SAME relative
  # nesting SHARED_ROOT had under ITS true toplevel and re-apply it inside
  # $WT now, once, mechanically. NEST_REL can legitimately point at a path
  # that is NOT tracked in this repo at all (e.g. a Dog invoked from some
  # untracked scratch subdir that isn't gascity-shaped) — that's not an
  # error, there's simply nothing to mirror, so fall back to $WT rather than
  # fail closed; only a `cd` that fails despite the directory existing is
  # treated as fatal.
  SHARED_ROOT_TOPLEVEL="$(git -C "$SHARED_ROOT" rev-parse --show-toplevel 2>/dev/null)"
  SHARED_ROOT_PHYSICAL="$(cd "$SHARED_ROOT" 2>/dev/null && pwd -P)"
  NEST_REL=""
  if [ -n "$SHARED_ROOT_TOPLEVEL" ] && [ -n "$SHARED_ROOT_PHYSICAL" ]; then
    case "$SHARED_ROOT_PHYSICAL" in
      "$SHARED_ROOT_TOPLEVEL"/*)
        NEST_REL="${SHARED_ROOT_PHYSICAL#"$SHARED_ROOT_TOPLEVEL"/}"
        ;;
    esac
  fi
  if [ -n "$NEST_REL" ]; then
    if [ -d "$WT/$NEST_REL" ]; then
      cd "$WT/$NEST_REL" || { echo "FATAL: isolation guard could not enter nested city root $WT/$NEST_REL" >&2; exit 1; }
      echo "  NESTED-REPO GUARD: shared root was nested at '$NEST_REL' under its true toplevel — entered $(pwd), not the worktree's outer boundary $WT"
    else
      echo "  NESTED-REPO GUARD: shared root was nested at '$NEST_REL' under its true toplevel, but that path is not tracked in this repo — nothing to mirror, staying at $WT"
    fi
  fi
fi
# === MOL-DO-WORK ISOLATION GUARD END (ga-xau4z) ===

if [ "$ISOLATED" != "1" ]; then
  git checkout -B "$BRANCH" origin/main
fi
bd update {{issue}} --set-metadata branch="$BRANCH"
# Real lease refresh (ga-z93p0) — distinct from `gc bd heartbeat`'s dashboard
# stamp; this is the one `bd reclaim` actually reads. Non-fatal: a heartbeat
# failure must never block real work.
bd heartbeat {{issue}} || echo "WARN(ga-z93p0): heartbeat failed for {{issue}} — verify this worker still owns the bead" >&2
echo "Branch: $BRANCH"
```

**3. Implement the solution:**

Do exactly what the bead describes. Follow existing codebase conventions.
Run the verification commands requested by the bead. If the bead does not
name verification commands, run the smallest relevant local test/build check
you can find.

```bash
git status --short               # Check what you've changed
```

Commit your changes with a meaningful message:
```bash
git add <files>
git commit -m "<type>({{issue}}): <brief description>"
```

Do not commit unrelated runtime metadata, caches, or bead database churn.

**4. Push your branch:**
```bash
# ga-z93p0 — refresh the real lease before handoff
bd heartbeat {{issue}} || echo "WARN(ga-z93p0): heartbeat failed for {{issue}} — verify this worker still owns the bead" >&2
git push origin "$BRANCH"
```

If push fails with "not fast-forward":
```bash
git fetch origin
git rebase origin/main
git push origin "$BRANCH"
```

**5. Submit via gate-done (NOT direct close):**

This creates a durable marker in the city DB. The launchd guard detects it
within ~2 minutes and dispatches 3 independent reviewers. G merges to main
on all-PASS and closes the source bead. You will be notified via nudge.

```bash
# Gather context for the marker
BRANCH=$(git branch --show-current)
if [ -z "$GC_CITY_PATH" ]; then
  GC_CITY_PATH=$(gc --city . config show 2>/dev/null | grep 'city_path' | head -1 | sed 's/.*=[ ]*//' | tr -d '"' || echo "")
fi
BASE_COMMIT=$(git rev-parse origin/main 2>/dev/null || echo "unknown")
RIG=$(gc --city "$GC_CITY_PATH" rig list --json 2>/dev/null \
  | jq -r --arg cwd "$(git rev-parse --show-toplevel 2>/dev/null || pwd)" \
      '.rigs[] | select(.path == $cwd) | .name' 2>/dev/null | head -1 || echo "unknown")
AUTHOR="${GC_ALIAS:-${BEADS_ACTOR:-worker}}"

MARKER_ID=$(bd -C "$GC_CITY_PATH" create \
  "ready-for-gate: $BRANCH" \
  -t chore --ephemeral \
  -l type:quality-gate-marker \
  -l gate-status:ready \
  -l "branch:$BRANCH" \
  -l "source-bead:{{issue}}" \
  -d "branch: $BRANCH
bead_id: {{issue}}
author: $AUTHOR
base_commit: $BASE_COMMIT
rig: $RIG
submitted_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
  --json 2>/dev/null | jq -r '.id // empty')

if [ -z "$MARKER_ID" ]; then
  echo "ERROR: Failed to create gate marker. Check Dolt is running: gc dolt status"
  exit 1
fi
echo "Gate marker created: $MARKER_ID"
echo "The launchd guard will pick this up within ~2 minutes."
echo "You will be nudged when the gate passes or fails."
echo "DO NOT close bead {{issue}} — G does it on pass."
```

**6. Close this formula step (NOT the source bead):**

Build path only — if you parked instead, step 5 of the PARK PROCEDURE
above already closed your sling; skip this.

```bash
if [ -n "${GC_BEAD_ID:-}" ] && [ "$GC_BEAD_ID" != "{{issue}}" ]; then
  bd update "$GC_BEAD_ID" --set-metadata gc.outcome=pass --status=closed \
    --notes "Gate marker created: ${MARKER_ID:-unknown}. Branch: $BRANCH. Source bead {{issue}} pending gate review."
fi
```

If you get stuck or need clarification, check your inbox:
```bash
gc mail inbox
```

**Exit criteria:** EITHER branch pushed + gate marker created + formula
step closed (build path), OR blocker dependency recorded + labels updated
+ formula step closed (park path). Source bead {{issue}} remains open in
both cases — G closes it when the gate passes (build path), or the
self-healing dependency makes it dispatch-eligible again once the blocker
closes (park path)."""

[[steps]]
id = "drain"
title = "Close drain step and signal completion"
needs = ["do-work"]
description = """
Work is submitted to the gate (build path) or parked (park path) — either
way your sling should already be closed, by step 6 or by the PARK
PROCEDURE. Close it here only as a backstop if it's somehow still open —
never overwrite an outcome ("pass" or "parked") a prior step already
recorded — then signal the controller to reclaim this session:

```bash
if [ -n "${GC_BEAD_ID:-}" ]; then
  SLING_STATUS=$(bd show "$GC_BEAD_ID" --json 2>/dev/null | jq -r '.[0].status // ""')
  if [ "$SLING_STATUS" != "closed" ]; then
    bd update "$GC_BEAD_ID" --set-metadata gc.outcome=pass --status=closed --notes "Drain acknowledged. Gate marker submitted."
  fi
fi
gc runtime drain-ack
```

Run exactly these commands and nothing else."""
