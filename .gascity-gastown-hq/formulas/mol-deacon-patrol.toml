description = """
Deacon patrol loop. Poured as a root-only wisp on startup:

  gc bd mol wisp mol-deacon-patrol --root-only --var binding_prefix='{{binding_prefix}}'
  gc bd update $WISP --assignee=$GC_AGENT

Each wisp is ONE iteration: check inbox, run town-wide coordination
tasks, pour the next iteration. On crash, re-read the formula steps
and determine where you left off from context.

Formula steps are NOT materialized as child beads. Read the step
descriptions below and work through them in order.

The loop mechanism: every exit path (happy or early) pours the next
wisp before burning this one. The prompt only bootstraps the first wisp.

## Deacon Role

The deacon is the **LLM sidekick to the controller**. It handles periodic
tasks that require judgment or observation — things the Go controller
can't or shouldn't do.

1. **Work-layer health** — are witnesses and refineries making progress?
   (Not "are they running" — that's the controller's job.)
2. **Utility agent health** — detect stuck dogs, dispatch shutdown dance.
3. **Orphan process cleanup** — kill leaked claude/node subagent processes.
4. **System diagnostics** — run `gc doctor`, act on findings.

Mechanical tasks (gate evaluation, cross-rig deps, orphan bead sweeps,
wisp compaction) are handled by exec orders in the maintenance
pack — no LLM needed.

## Idle Town Principle

The deacon should be silent/invisible when the town is healthy and idle.
Skip health checks when no active work exists. Use exponential backoff
between patrol cycles.

## What the deacon does NOT do

- Start/stop/restart agents (controller handles this)
- Per-rig orphaned bead recovery (witness handles this)
- Code implementation (polecats do this)
- Kill agents directly (files warrants, dog pool runs shutdown dance)
- Pool sizing (controller pool reconciliation)

Read each step's description before acting — Config values override defaults.

## Cross-Rig Bead Close (gt-pm55p fix)

NEVER use bare `bd close <id>`. ALWAYS specify the owning city with `-C`.
Bare `bd` auto-discovers the db from cwd; if you've cd'd into a rig clone
or the deacon repo (which has a malformed config.yaml), it finds the wrong
database and the close silently no-ops — causing a reassign loop.

**For HQ beads** (ga-*, dc-*, or any prefix not matching a known rig):
```bash
bd -C "$GC_CITY" close <id>
bd -C "$GC_CITY" update <id> --status=in_progress
```

**For rig beads** (wa-*, ps-*, gt-*) — resolve city from prefix:
```bash
_prefix="${BEAD_ID%%-*}"
_rig_path=$(gc --city "$GC_CITY" rig list --json \
  | jq -r --arg pfx "$_prefix" '.rigs[] | select(.prefix == $pfx) | .path // empty' \
  | head -1)
bd -C "${_rig_path:-$GC_CITY}" close "$BEAD_ID"
```"""
formula = "mol-deacon-patrol"
version = 15

[vars]
[vars.binding_prefix]
description = "Import binding prefix for gastown agent identities, including trailing dot when bound."
default = ""

[vars.event_timeout]
description = "Seconds to sleep before re-checking. Replaces former event-watch loop which hot-spun on cache-reconcile firehose."
default = "60"

[[steps]]
id = "check-inbox"
title = "Context check, then mail"
description = """
**1. Context check (FIRST — before any work):**
```bash
RSS=$(ps -o rss= -p $$ | tr -d ' ')
RSS_MB=$((RSS / 1024))
```

If RSS > 1500 MB or context feels heavy, request a restart:
```bash
gc runtime request-restart
```
This sets `GC_RESTART_REQUESTED` metadata on the session and blocks
forever. The controller will kill and restart the session on the next
reconcile tick. The current wisp stays assigned and the new session
the new session re-reads formula steps and resumes from context.

**2. Check mail:**
```bash
gc mail inbox
```

Handle each message type:

**HELP / Escalation:**
Assess the request. Can you help directly? If not, escalate:
```bash
gc mail send mayor/ -s "ESCALATION: <agent> needs help" -m "<details>"
```
Archive after handling.

**DOG_DONE:**
A utility agent completed its task (e.g., shutdown dance, dep
propagation). Note the outcome for observability. Archive.

**Other / informational:**
Archive after reading.

**Hygiene principle**: Archive messages after they're fully processed.
Inbox should be near-empty after this step.

Close this step and proceed."""

[[steps]]
id = "orphan-process-cleanup"
title = "Kill orphaned claude subagent processes"
needs = ["check-inbox"]
description = """
Claude Code's Task tool spawns subagent processes that sometimes don't
clean up. These accumulate and consume significant memory.

**Detection:** Orphaned subagent processes have TTY = "?" in `ps` output.
They are child processes of claude/node that lost their parent.

```bash
ps aux | grep -E 'claude|node' | grep '?'
```

**Judgment required:** Not all TTY=? processes are orphaned. Some are
legitimate background processes. Look for:
- Processes consuming significant memory (>500MB RSS)
- Processes that have been running much longer than any active session
- Multiple identical processes (accumulated from repeated crashes)

**Action:** Kill confirmed orphans:
```bash
kill <pid>
```

Use judgment — this is exactly why an LLM does it, not Go code.

Close this step after check (even if no orphans found)."""

[[steps]]
id = "health-scan"
title = "Check work-layer health"
needs = ["orphan-process-cleanup"]
description = """
Monitor whether work is flowing through rig coordination agents.
The controller handles "is the agent running?" The deacon handles
"is work progressing?"

**Skip docked/parked rigs.** Only check active rigs.

**For each active rig, assess witness health:**

Check witness patrol wisp freshness. Each patrol cycle burns a wisp.
If the last wisp is much older than the maximum backoff cap (300s) plus
buffer, the witness may be stuck. But if there's no active work in the
rig, the witness is legitimately idle — not stuck.

**For each active rig, assess refinery health:**

Check refinery patrol wisp freshness + queue state:
- Wisp recently burned → healthy (actively cycling)
- Wisp open, no work assigned to refinery → idle, fine
- Wisp open, work assigned to refinery, stale `UpdatedAt` → stuck

**No hardcoded thresholds.** Read wisp timestamps, queue state, and
the nature of the current work. Make a judgment call about whether
something is stuck. This is exactly why an LLM does it, not Go code.

**For stuck coordination agents, file a warrant:**
```bash
gc bd create --type=task --label=warrant \
  --title="Stuck: <rig>/<role>" \
  --metadata '{"target":"<session>","reason":"<reason>","requester":"deacon","gc.routed_to":"{{binding_prefix}}dog"}'
```

The dog pool runs `mol-shutdown-dance` for due process.

**Escalate to mayor** only for systemic issues (multiple rigs affected,
patterns of failure).

Close this step after assessment."""

# ga-d8dfjg9 (same class as ga-x9jivyf / ga-jhsxo4p): the Step 1 block of this step read "failed" and "empty" as the same thing, in two places.
# (1) `gc agents list --json --active | jq ... | while read` -- `gc agents list` does not exist in this gc: it exits 1 and prints a JSON ERROR object on
#     stdout ({"ok":false,"error":{"code":"json_command_not_found",...}}, measured 2026-11-13), which the old `jq '.[] | .agent_id'` turned into no
#     lines, so the loop never ran and a step that never ran read as "no active sessions". The session list is `gc session list --json --state
#     active` now (an object: .ok, .sessions[].agent_name), and a failed or unreadable list prints one NAO-SEI line instead of nothing.
# (2) per agent, A and B came from TWO `gc bd list` calls whose failure was only on stderr: both blank when the read failed (the step's prose
#     only says "A > 0 and stale signal", so blank was free to be read as 0 and silence a starving queue, or as "no signal"), and A ok + B blank
#     when only the second call failed (read as "work queued, no signal at all": a nudge and a warrant against a healthy session). Now ONE read per
#     agent, its exit code read, its JSON validated, A and B derived from that one JSON; failed/unreadable = NAO-SEI on both columns.
# Proof: packs/town-deltas/assets/deacon-queue-starvation-three-states.selftest.sh executes the block under a stateful fake gc.
[[steps]]
id = "queue-starvation-check"
title = "Cross-check assigned work against visible work signal"
needs = ["health-scan"]
description = """
Cross-check assigned work against visible work signal. A session can
look healthy-idle in a patrol wisp view while its queue is silently
starving — the refinery (upstream #1833) self-polled for 13h42m with
seven beads in its queue and no visible work signal, because its poll
filter resolved to an identity that didn't match its own.

The deacon's wisp-freshness check catches "no patrol activity" but not
"active polling, wrong filter, queue silently piling up." This step
closes that gap.

**Step 1: For each active coordination/merge session, compute the pair:**
- `A` = count of open beads assigned to the session's agent identity
- `B` = the most recent bead.updated_at across those beads (work signal)

Every read here has THREE answers, never two: it answered with rows / it answered and is empty / it
could not tell (failed, timed out, came back unreadable). The block prints `NAO-SEI` (not "0", not a
blank) for the third, so a failed read can never look like an idle session or like a starving one.
A and B come from ONE `gc bd list` per agent (two calls could disagree: the first answers, the second
times out, and the line then says "work queued, no signal"). The session list is
`gc session list --json --state active` (ga-d8dfjg9: `gc agents list`, which this step used to call, does
not exist in this gc, so the old loop never ran and a step that never ran looked like "no sessions").

```bash
# vazio → the list answered (ok=true, sessions=[]) with no session: prints "0 active sessions" (a real answer); falhou/ilegível → one NAO-SEI line, never "no session"
# (an EMPTY stdout is not an answer: jq -e on empty input exits 4, so it lands in the NAO-SEI branch; plain jq would call it an empty list)
if ! LIST=$(gc session list --json --state active) ||
   ! printf '%s' "$LIST" | jq -e '.ok == true and ((.sessions | type) == "array")' >/dev/null 2>&1 ||
   ! AGENTS=$(printf '%s' "$LIST" | jq -r '.sessions | map(.agent_name // empty) | unique | .[]'); then
    printf 'NAO-SEI\tNAO-SEI\tNAO-SEI\n'
elif [ -z "$AGENTS" ]; then
    echo "0 active sessions (the session list answered and is empty)"
else
    printf '%s\n' "$AGENTS" | while read -r AGENT; do
        # vazio → [] = this agent holds no open bead: A=0, B blank (legitimate only with A=0); falhou/ilegível → NAO-SEI on both, nothing is inferred
        if ! JSON=$(gc bd list --status=open --assignee="$AGENT" --json --limit=0) ||
           ! printf '%s' "$JSON" | jq -e 'type == "array"' >/dev/null 2>&1; then
            printf '%s\tNAO-SEI\tNAO-SEI\n' "$AGENT"
            continue
        fi
        ASSIGNED=$(printf '%s' "$JSON" | jq 'length')
        LATEST=$(printf '%s' "$JSON" | jq -r '[.[].updated_at // empty] | max // ""')
        # every bead has updated_at: A > 0 with B blank means the rows were unreadable, not "no signal"
        if [ "$ASSIGNED" -gt 0 ] && [ -z "$LATEST" ]; then LATEST=NAO-SEI; fi
        printf '%s\t%s\t%s\n' "$AGENT" "$ASSIGNED" "$LATEST"
    done
fi
```

Read the output line by line (TAB-separated `agent`, `A`, `B`): a line with `NAO-SEI` is "could not
tell", NOT zero and NOT stale. No line at all cannot happen (an empty list prints "0 active
sessions"). The block's own exit code says nothing: read the lines.

The latest bead.updated_at is the cheapest proxy for "did this session
move work recently?" — every claim, status transition, metadata update,
or note bumps it.

**Step 2: Flag when queue > 0 and signal is stale (judgment call,
guideline ~30min):**

A line with `NAO-SEI` is never flagged: no nudge, no warrant, nothing inferred from it. Note it in this
round's log and read that agent again next cycle; the same agent (or the session list itself) at
`NAO-SEI` three cycles in a row is a Dolt/bd problem, not a queue problem: nudge the mayor
(`gc session nudge mayor/ "deacon: queue-starvation-check cannot read <agent or session list> 3x"`).

If `A > 0` AND `now - B` has grown well past the patrol's natural
cadence (default guideline: 30min — roughly 6x the 300s max patrol
backoff), the session is holding work without making progress. This
is exactly why an LLM does it, not Go code. Consider:
- Coordination agents (refinery, witness) naturally cycle in seconds
  when work is present; 30min is an eternity, not a lull.
- Polecats may take longer per step; be more lenient before flagging.
- A freshly-assigned bead with no prior activity gets `updated_at` at
  assignment time; if it's hours old, the session picked it up but
  never acted.

**Step 3: For flagged sessions, nudge first, then warrant:**

```bash
gc session nudge "$STUCK_SESSION" "Queue has $ASSIGNED open beads, no bead activity for <duration>. Run gc hook."
```

If the nudge doesn't unstick within the next patrol cycle, escalate
by filing a warrant for the dog pool:

```bash
gc bd create --type=task --label=warrant \\
    --title="Stuck queue: <session> — $ASSIGNED beads, no activity $duration" \\
    --metadata '{"target":"<session>","reason":"queue starvation: N beads, no bead.updated_at progress","requester":"deacon","gc.routed_to":"{{binding_prefix}}dog"}'
```

The dog runs `mol-shutdown-dance` and the controller respawns a fresh
session that re-reads the queue with a correct filter.

**Step 4: A genuinely-idle session (no assigned beads) is NOT flagged.**
If `A == 0` (a real 0, from a read that answered), this step is a no-op for that session.
Idle-but-ready refineries and witnesses are healthy. `NAO-SEI` is not 0: see Step 2.

Close this step after the cross-check runs for every active session."""

[[steps]]
id = "utility-agent-health"
title = "Check utility agent (dog) health"
needs = ["queue-starvation-check"]
description = """
Detect utility agents (dogs) that are alive but stuck on their work.

The controller detects dead agents. But "working too long" is a
work-layer judgment: is this task genuinely slow, or is the agent stuck?
The controller can't know this. The deacon can, by checking bead and
wisp timestamps.

**Step 1: Find active utility agent work:**
```bash
gc bd list --status=in_progress --metadata-field gc.routed_to={{binding_prefix}}dog --json --limit=0
```

**Step 2: For each, assess progress:**

Check the work bead's `UpdatedAt` and the agent's wisp freshness.
Consider the nature of the work — a shutdown dance with 240s timeouts
will naturally take longer than a quick dep propagation.

No hardcoded thresholds. Use judgment.

**Step 3: For stuck utility agents, file a warrant:**
```bash
gc bd create --type=task --label=warrant \
  --title="Stuck dog: <agent>" \
  --metadata '{"target":"<session>","reason":"<reason>","requester":"deacon","gc.routed_to":"{{binding_prefix}}dog"}'
```

A different dog from the pool picks up the warrant and runs the
shutdown dance. If the pool is at capacity with all dogs stuck,
escalate to mayor.

Close this step after assessment."""

[[steps]]
id = "dolt-health"
title = "Run Dolt data-plane health check"
needs = ["utility-agent-health"]
description = """
Run `gc dolt health --json` to inspect the Dolt data plane and flag anomalies.

This step surfaces problems that individual patrol steps won't catch:
commit bloat (compactor dog may have failed), stale backups (backup dog
may have failed), orphan databases, and zombie Dolt server processes.

**Step 1: Run the health check**
```bash
gc dolt health --json
```

Parse the JSON output (HealthReport schema):
- `server`: running, reachable, pid, port, latency_ms
- `databases[]`: name, commits, open_beads
- `backups`: dolt_freshness, dolt_age_seconds, dolt_stale
- `processes`: zombie_count, zombie_pids
- `orphans[]`: name, size

Note: `--json` always exits 0 when the payload is well-formed; health
state is signalled in-band. Key decisions off `server.reachable`, not
`server.running` — a process can hold the port while its goroutines
are wedged (the latter is what first prompted this check to exist).

**Step 2: Evaluate thresholds**

| Signal | Threshold | Meaning |
|--------|-----------|---------|
| `server.reachable == false` | — | Dolt server is down or unresponsive (CRITICAL) |
| `server.latency_ms > 5000` | 5 s | Server may be overloaded |
| `databases[].commits > 50000` | 50 k | Compactor dog may have stalled |
| `backups.dolt_stale == true` | >30 min | Backup dog may have failed |
| `processes.zombie_count > 0` | any | Zombie Dolt servers detected |
| `orphans` non-empty | any | Orphan databases accumulating |

**Step 3: React to alerts**

**Server down (CRITICAL):** `server.reachable == false` — either no
process is listening on the port, or a process is listening but not
answering SQL (wedged goroutines, migration lock, saturated pool).
```bash
gc mail send mayor/ -s "ESCALATION: Dolt server unreachable [CRITICAL]" \\
  -m "gc dolt health reports server.reachable=false"
```

**Commit bloat (commits > 50k in any DB):**
The compactor dog (`mol-dog-compactor`) may have failed. Log for awareness.
If the compactor order is configured, it will self-dispatch. Otherwise
nudge the dog pool:
```bash
gc session nudge dog/ "Compactor needed: <db_name> has <count> commits"
```

**Stale backups:**
The backup dog (`mol-dog-backup`) may have failed. Same pattern — log and
nudge if order hasn't self-healed:
```bash
gc session nudge dog/ "Backup needed: dolt backup is <age> old"
```

**Zombie processes:**
Kill zombie Dolt servers not on the expected port:
```bash
kill <zombie_pid>
```

**Orphan DBs:**
Run cleanup:
```bash
gc dolt cleanup
```
If orphan count exceeds safety limit, escalate to mayor.

**If everything is healthy:**
Log `Dolt health: OK` and move on.

**Exit criteria:** Health check run, alerts handled or escalated."""

[[steps]]
id = "system-health"
title = "Run system diagnostics"
needs = ["dolt-health"]
description = """
Run `gc doctor` for a quick workspace health check.

```bash
gc doctor
```

**For simple findings:** Act directly (e.g., stale lock files, temp
directory cleanup).

**For complex findings:** Escalate to mayor with context:
```bash
gc mail send mayor/ -s "DOCTOR: <finding>" -m "<details>"
```

Close this step after check."""

# ga-x9jivyf (same class as ga-jhsxo4p, mol-witness-patrol): step 3 of `next-iteration` used to pour with no read first and
# never read the assign's exit code, so a pour that worked followed by an assign that failed left a next wisp with no owner
# (no --assignee read finds it; the wisp reaper only closes a wisp whose parent is closed, and a root-only patrol wisp has
# none) and a re-run poured another. It now reads my live wisps first (three states), assigns, reads the assign's exit
# code and burns the wisp it just poured when it cannot assign it, and exits 0 only with a next wisp assigned; the prose
# says what exit 1 means (do not go on to step 4, do not burn this wisp).
# No -C pin and no rig_root here, unlike mol-witness-patrol: this step, like the other `gc bd` calls of this file except the
# cross-rig close described in the header, uses the store its session's cwd resolves to.
# Proof: packs/town-deltas/assets/deacon-next-iteration-idempotent.selftest.sh executes the block under a stateful fake gc.
[[steps]]
id = "next-iteration"
title = "Pour next iteration and loop"
needs = ["system-health"]
description = """
**Config: event_timeout = {{event_timeout}}**

End of patrol cycle. Pour the next iteration, then wait or exit.

**1. Context check:**

If context feels heavy or RSS is high:
```bash
gc runtime request-restart
```
This blocks forever. The controller restarts you. The next wisp
is already assigned — the new session resumes from context.

**2. Quick inbox check (end-of-cycle hygiene):**
```bash
gc mail inbox
```
Handle any urgent messages that arrived during patrol. Archive the rest.

**3. Pour next iteration BEFORE burning:**

Run the block below as written (ga-x9jivyf). It is safe to re-run: it READS before it pours, so a
second run never pours a second next wisp behind one that is already poured and assigned to you,
and a wisp it poured but could not assign is burned, not left behind. Only a clean answer may pour:
- two or more live wisps are assigned to you (this one plus a next one) -> a next wisp already
  exists: it does not pour and says so;
- one or none -> it pours, then assigns the new wisp to you;
- the read could not tell (it failed or came back unreadable) -> it says NOT pouring and exits 1.
The two failures it cannot undo (the burn fails too, or the pour answers with no wisp id) are
mailed to the mayor.

Exit 0 = a next wisp exists and is assigned to you: go on to step 4. Exit 1 = the block could not
confirm that (it says why): do NOT go on to step 4 and do NOT burn this wisp. Wait a minute, then
run the block again. Three exit 1 in a row: nudge the mayor (`gc session nudge mayor/ "deacon: next-iteration failing 3x"`,
adding the last line the block printed) and end the turn without burning.
```bash
[ -n "$GC_AGENT" ] || { echo "next-iteration: GC_AGENT is empty -- cannot tell which wisps are mine; NOT pouring." >&2; exit 1; }
# vazio → [] or one wisp (this one): pour; tem → 2+ (this one plus a next one): a next wisp already exists, no pour; falhou/ilegível → do not know: NOT pouring, exit 1 (--limit=2 on purpose: two is all the decision needs to see)
LIVE=$(gc bd list --assignee="$GC_AGENT" --type=molecule --include-infra --limit=2 --json) &&
  LIVE=$(printf '%s' "$LIVE" | jq -er 'if type != "array" then error("not an array") else length end') ||
  { echo "next-iteration: cannot tell whether a next wisp already exists (the read of my live wisps failed or came back unreadable) -- NOT pouring, this wisp NOT burned; wait a minute and re-run this block." >&2; exit 1; }
if [ "$LIVE" -ge 2 ]; then
  echo "next-iteration: a next wisp already exists ($LIVE live wisps are assigned to $GC_AGENT, this one included) -- NOT pouring another; go on to step 4."
  exit 0
fi
# vazio → no wisp id: a wisp MAY exist (the answer can be lost after the commit), so nothing is assigned or burned by guess and the mayor is told; falhou/ilegível → the same
NEXT=$(gc bd mol wisp mol-deacon-patrol --root-only --var binding_prefix='{{binding_prefix}}' --json | jq -r '.new_epic_id // empty')
if [ -z "$NEXT" ]; then
  echo "next-iteration: the pour returned no wisp id -- a wisp MAY have been created and left unassigned; nothing assigned, nothing burned, this wisp NOT burned." >&2
  gc mail send mayor/ -s "DEACON: mol-deacon-patrol pour returned no wisp id" -m "next-iteration poured for $GC_AGENT and got no wisp id back (the pour failed, or its answer was lost after the wisp was created). A stray unassigned wisp may exist; look with: gc bd list --no-assignee --type=molecule --include-infra --status=open --limit=0 --json -- and burn a mol-deacon-patrol wisp you find there with: gc bd mol burn <id> --force. This wisp was NOT burned."
  exit 1
fi
# a write, not a read: when the assign fails, burn the wisp just poured (never this one) so a re-run starts clean; when the burn fails too, say so and mail the id
if ! gc bd update "$NEXT" --assignee="$GC_AGENT"; then
  if gc bd mol burn "$NEXT" --force; then
    echo "next-iteration: could not assign $NEXT to $GC_AGENT -- burned it, nothing left behind; this wisp NOT burned; wait a minute and re-run this block." >&2
  else
    echo "next-iteration: could not assign $NEXT to $GC_AGENT and could not burn it either -- $NEXT is LEFT BEHIND (probably unassigned); this wisp NOT burned; the mayor is mailed with its id." >&2
    gc mail send mayor/ -s "DEACON: mol-deacon-patrol left a stray wisp $NEXT" -m "next-iteration poured $NEXT for $GC_AGENT but could neither assign nor burn it. If it is unassigned, no assignee read finds it, and the wisp reaper only closes a wisp whose parent is closed (a root-only patrol wisp has no parent). Clean up with: gc bd mol burn $NEXT --force. This wisp was NOT burned."
  fi
  exit 1
fi
echo "next-iteration: next wisp $NEXT is poured and assigned to $GC_AGENT; go on to step 4."
```

**4. Wait before next cycle:**
```bash
sleep {{event_timeout}}
```

Previous implementation watched `gc events --type=bead.updated` for fast wake-up, but cache-reconcile fires that event constantly, turning the watch into a tight loop with no useful backoff. Fixed sleep gives predictable idle cost.

**5. Burn this wisp:**
```bash
gc bd mol burn <this-wisp-id> --force
```

Burn only the wisp you are executing now, never the next wisp from step 3.

The new wisp is ready. Re-read formula steps to start
the next patrol cycle.

**Exit criteria:** Next wisp poured, this wisp burned."""
