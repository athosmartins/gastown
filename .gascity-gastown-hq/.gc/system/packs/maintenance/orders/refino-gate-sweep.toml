# Refino quality gate (ga-gpr2v). Reviews the QUALITY of every freshly-refined
# story (story:refino-review) with a Sonnet reviewer before it reaches Athos's
# approval queue. Sibling of gate-sweep.toml — but unlike the code gate (pure
# mechanical timer/GitHub decoding), this one DOES need LLM judgement, which is
# why it spawns an independent Sonnet reviewer session rather than running the
# verdict inline. One story per sweep; PASS → story:needs-approval, FAIL → bounce
# to the refiner, round-limit → escalate to Athos.
#
# Equivalent to com.gascity.refino-gate-dispatcher.plist (use ONE of the two —
# the order if the city runs an order controller, the plist on a plain launchd
# host). Both invoke the same dispatcher script.
[order]
description = "Refino quality gate — review refined stories, promote/bounce/escalate"
trigger = "cooldown"
interval = "3m"
exec = "$PACK_DIR/../../../../packs/town-deltas/assets/refino-gate-dispatcher.sh"
