# wa-worker: ephemeral rig-scoped worker for whatsapp_automation beads.
#
# ARCHITECTURE: This is a PROTOTYPE template proving that an ephemeral pool
# agent CAN carry WA rig context. The Pilot dispatch redesign will route
# WA beads with no story.assignee here instead of to named crew (mila-wa,
# oracle-wa, etc.). Named crew are persistent PMs/domain-owners; wa-workers
# are disposable build slots.
#
# RIG CONTEXT comes from work_dir=/Users/athos/gt/whatsapp_automation/crew/worker
# — placing the agent's CWD inside the WA rig clone. This is the same mechanism
# that gives mila-wa its rig context (work_dir = .../crew/mila). From there:
#   - `bd` resolves to the WA bead store (wa-* prefix)
#   - `git` operates on the WA rig repo
#   - `gc sling` routes within the WA rig scope
#
# EPHEMERAL: min_active_sessions=0 means no permanent instances.
# The supervisor spawns a wa-worker on demand (via gc sling or future
# Pilot dispatch) and the agent drains + exits after /gate-done.
# wake_mode=fresh ensures each spawn starts with a clean session (no
# context from prior runs — correct for a disposable build agent).
#
# LIFECYCLE: spawn → claim bead → create worktree → build → commit
# → git push → /gate-done → gc runtime drain-ack → exit
#
# POOL SIZE: originally max_active_sessions=4, matching oracle-wa + mila-wa
# combined capacity (2 named crew × 1 slot each) so this pool never starves
# the gate. Cut to 2 on 2026-08-26 (Athos, multiple choice, ga-xsd03) as part
# of a citywide pool-ceiling reduction (wa-worker 4->2, gate-reviewer 6->3,
# ps-worker 2->1) to flatten a macOS swap-ratchet disk crisis that had
# already stalled the gate. ga-xsd03 closed confirming the cut is live and
# disk/swap stabilized — see agents/gate-reviewer/agent.toml's ga-5hdsr
# comment for the full history and how to raise it back once headroom is
# confirmed healthy again.
#
# MODEL: Sonnet. Build work is well within Sonnet's capabilities. Keeps wa-worker
# off the scarce weekly Opus budget (which is reserved for Mayor / named crew).
#
# PROVIDER: claude-headless (RC OFF). wa-workers are headless/ephemeral and must
# NOT auto-connect to the human's mobile Claude Code app (bug wa-9ye2 pattern).

work_dir = "/Users/athos/gt/whatsapp_automation/crew/worker"
min_active_sessions = 0
max_active_sessions = 2
idle_timeout = "2h"
wake_mode = "fresh"
model = "sonnet"
provider = "claude-headless"
# NOTE: dir= intentionally ABSENT (pilot-spawn fix). Setting dir="whatsapp_automation"
# makes the agent rig-scoped, which prevents `gc session new wa-worker` from
# discovering it (city-level command only finds city-scoped agents). The Pilot
# spawns wa-workers explicitly via `gc session new wa-worker --no-attach` after
# bd assign (rig-native path); rig context comes from work_dir (not dir=).
# Without dir=, the supervisor scale_check reads the HQ store (not WA); that is
# acceptable because we spawn explicitly — we do NOT rely on supervisor auto-spawn.
# If gc sling cross-store routing is ever needed add --force; rig-native path uses
# bd assign directly and never needs gc sling for WA beads.
