# wa-worker: ephemeral rig-scoped worker for whatsapp_automation beads.
#
# ARCHITECTURE: This is a PROTOTYPE template proving that an ephemeral pool
# agent CAN carry WA rig context. The Pilot dispatch redesign will route
# WA beads with no story.assignee here instead of to named crew (mila-wa,
# oracle-wa, etc.). Named crew are persistent PMs/domain-owners; wa-workers
# are disposable build slots.
#
# RIG CONTEXT comes from work_dir=/Users/athos/gt/whatsapp_automation/crew/worker
# — placing the agent's CWD inside the WA rig clone. This is the same mechanism
# that gives mila-wa its rig context (work_dir = .../crew/mila). From there:
#   - `bd` resolves to the WA bead store (wa-* prefix)
#   - `git` operates on the WA rig repo
#   - `gc sling` routes within the WA rig scope
#
# EPHEMERAL: min_active_sessions=0 means no permanent instances.
# The supervisor spawns a wa-worker on demand (via gc sling or future
# Pilot dispatch) and the agent drains + exits after /gate-done.
# wake_mode=fresh ensures each spawn starts with a clean session (no
# context from prior runs — correct for a disposable build agent).
#
# LIFECYCLE: spawn → claim bead → create worktree → build → commit
# → git push → /gate-done → gc runtime drain-ack → exit
#
# POOL SIZE: originally max_active_sessions=4, matching oracle-wa + mila-wa
# combined capacity (2 named crew × 1 slot each) so this pool never starves
# the gate. Cut to 2 on 2026-08-26 (Athos, multiple choice, ga-xsd03) as part
# of a citywide pool-ceiling reduction (wa-worker 4->2, gate-reviewer 6->3,
# ps-worker 2->1) to flatten a macOS swap-ratchet disk crisis that had
# already stalled the gate. ga-xsd03 closed confirming the cut is live and
# disk/swap stabilized — see agents/gate-reviewer/agent.toml's ga-5hdsr
# comment for the full history and how to raise it back once headroom is
# confirmed healthy again.
# Raised 2 -> 3 on 2026-09-11 (Athos, multiple choice in the Mayor's session,
# ~09:00Z). Why: the pool was the bottleneck. 35 small beads were queued, the
# Pilot small lane opens 3 slots, and the gate sat 97 min with nothing to
# review. The disk crisis that night came from the ficha360 nightly job
# (disabled; fix in wa-ao1pl), not from workers. Revert to 2 if
# dolt-disk-floor-guard goes CRITICAL again.
#
# ESSE REVERT ACONTECEU — e o valor abaixo e 2 de proposito, nao um 3 perdido.
# Commit 415b78f18 "fix(ops): revert wa-worker pool 3 -> 2 under memory
# saturation" desfez o f2a98cfbd acima. Ate 16/09 este bloco so contava a
# subida e nao o revert, entao lido de cima a baixo ele sugeria que o 3 tinha
# se perdido e devia ser 'restaurado'. Nao deve. Estado em 16/09 12:2x que
# sustenta o 2: swap em 8.24 de 9.22 GB (89%) com o ratchet do macOS, que so
# libera em reboot; memoria livre em 46% NAO e o numero que decide isso.
# O teto tambem esta no env do launchd do Pilot (PILOT_WA_WORKER_MAX=2) —
# mudar aqui sem mudar la deixa os dois discordando.
#
# E o teto NAO e a largura da lane. O default no script e MAX_SMALL=5
# (pilot-dispatcher.sh:87), mas o env do launchd do Pilot SOBRESCREVE com
# MAX_SMALL=3 e MAX_BIG=1 — e 3 e o valor que vale (o log confirma: "small=3/3
# ... big=1/1"). Ou seja, o comentario de 11/09 acima ("the Pilot small lane
# opens 3 slots") esta CERTO; quem le so a linha 87 do script conclui 5 e erra.
# O descasamento real e lane small 3 contra pool 2: o Pilot pode rotear uma 3a
# bead small que o pool de 2 nunca consome — e ai ela encalha (ga-q0ewpu: o
# top-up que deveria repor consulta o store errado).
# Aumentar o teto NAO corrige esse encalhe, so o torna menos frequente.
#
# Raised 2 -> 4 on 2026-09-19 ~03:3x BRT (Athos, AskUserQuestion na sessao do
# Mayor 1603d407: "WA 4, cidade 9"). Por que: as 9 crews foram encerradas as
# 01:29 (decisao dele), entao o WA passou a depender SO deste pool, com 41
# beads prontas na fila (3 P0, 17 P1). Estado que sustenta o 4: reboot em 18/09
# 20:15 (swap 3,8 de 5,1 GB), memoria livre 60%, disco 9,4 GB (acima do warn de
# 8 GB do dolt-disk-floor-guard), e 7 sessoes de crew a menos. Casa com as
# lanes do Pilot (MAX_SMALL=3 + MAX_BIG=1 = 4). Mudado junto: PILOT_WA_WORKER_MAX=4
# e GC_VARIABLE_SESSION_MAX=9 no env do launchd do Pilot e do quality-gate-dispatcher.
# Mesma regra de volta: se o swap saturar de novo ou o disk-floor ficar CRITICAL,
# volta pra 2 (e avisa o Athos, que decidiu o 4).
#
# Baixado 4 -> 2 em 2026-09-28 (Mayor, ga-o3o09z; decisao registrada em
# comentario de 2026-09-25 20:33Z, execucao dispatchada pelo Pilot em 28/09
# 04:24Z). Motivo: a regra do Athos de 19/09 ("WA 4; se a rajada repetir -> 2")
# se cumpriu em 25/09 ~15:15-16:20 (load 60-74, swap 9 GB, disco 4,4 GB) - nao
# e decisao nova de capacidade, e aplicar a regra dele no lugar que de fato
# manda: o CONTROLADOR criava/acordava sessoes wa-worker-N ate 4 sem consultar
# o teto do plist do Pilot, entao havia 4 ativas contra o 2 do Pilot.
#
# FONTE UNICA: este valor e o que o controlador usa para decidir spawn/wake de
# wa-worker-N. O env PILOT_WA_WORKER_MAX=2 do plist do Pilot
# (~/Library/LaunchAgents/com.gascity.pilot.plist) fica redundante-mas-
# consistente (2 == 2): ele so limita o que o PROPRIO Pilot despacha, nunca
# alcanca o controlador - por isso o descasamento de 25/09 so se corrige aqui.
#
# SEGURANCA verificada ANTES de aplicar, no codigo do engine (nao so na
# teoria): baixar max_active_sessions ao vivo via `gc reload` e um DRENO
# gracioso, nunca kill de sessao com trabalho em andamento.
# applyNestedCaps/capWakeConfigByDemand (cmd/gc/pool_desired_state.go,
# cmd/gc/session_reconcile.go) so bloqueiam ADMISSAO de sessao nova ou wake de
# sessao asleep; sessoes ja active/start-pending/creating so sao CONTADAS no
# orcamento, nunca tocadas. canonicalConfigHash exclui pool-scaling do hash de
# drift, entao o cap sozinho nunca dispara restart/drain forcado de sessao
# viva (cmd/gc/config_hash.go). No momento desta mudanca so havia 1 wa-worker
# ativo (abaixo do 2 novo), entao nem esse dreno gracioso chegou a ser
# exercitado na pratica.
#
# GATILHO DE VOLTA PRA 4 (mesma decisao do Mayor): maquina sem swap crescente
# E disco > 15 GB livre por periodo sustentado - subir de volta tambem e
# executar a regra dele, sem precisar perguntar de novo.
#
# Raised 2 -> 3 on 2026-10-03 (~08:15 BRT, Athos, AskUserQuestion in the Mayor's
# session: "Subir para 3 (Recomendado)"). Why: 72 beads approved and 0 in flight
# (story:approved=72, fila_pool_cap=68). Machine at the time: load5 ~36-39/10
# cores, swap used 3.2 GB, disk free 13 GB, memory free 53% (25/09, when the cap
# went to 2: swap 9 GB, disk 4.4 GB). The Pilot plist PILOT_WA_WORKER_MAX went to 3
# in the same step (story-ga-o3o09z.sh: plist <= agent.toml). WAY BACK TO 2, part
# of the same decision, no need to ask again: swap used > 6 GB, OR disk free < 6 GB.
#
# Back 3 -> 2 on 2026-10-03 21:19 BRT (Mayor, applying the revert rule that was PART of
# the Athos decision above, no new question): disk free 5.9 GB < 6 GB (swap 4.8 GB).
#
# Up 2 -> 3 again on 2026-10-05 04:2x BRT (Mayor, same Athos decision — 3 is the standing
# cap and 2 only while a revert trigger holds): disk free 11 GB >= 6, swap used 4.9 GB <= 6.
# Pool starved (wa-2a2wn waiting 4 days on fila_pool_cap). Same revert rule still applies.
#
# Back 3 -> 2 on 2026-10-05 08:4x BRT (Mayor, revert rule of the same Athos decision): disk free
# 5.8 GB < 6 GB (swap 4.95 GB); a DISK HALT IMMINENT alert fired at the same time.
#
# MODEL: Sonnet. Build work is well within Sonnet's capabilities. Keeps wa-worker
# off the scarce weekly Opus budget (which is reserved for Mayor / named crew).
#
# PROVIDER: claude-headless (RC OFF). wa-workers are headless/ephemeral and must
# NOT auto-connect to the human's mobile Claude Code app (bug wa-9ye2 pattern).

work_dir = "/Users/athos/gt/whatsapp_automation/crew/worker"
min_active_sessions = 0
max_active_sessions = 2
idle_timeout = "2h"
wake_mode = "fresh"
model = "sonnet"
provider = "claude-headless"
# NOTE: dir= intentionally ABSENT (pilot-spawn fix). Setting dir="whatsapp_automation"
# makes the agent rig-scoped, which prevents `gc session new wa-worker` from
# discovering it (city-level command only finds city-scoped agents). The Pilot
# spawns wa-workers explicitly via `gc session new wa-worker --no-attach` after
# bd assign (rig-native path); rig context comes from work_dir (not dir=).
# Without dir=, the supervisor scale_check reads the HQ store (not WA); that is
# acceptable because we spawn explicitly — we do NOT rely on supervisor auto-spawn.
# If gc sling cross-store routing is ever needed add --force; rig-native path uses
# bd assign directly and never needs gc sling for WA beads.
