idle_timeout = "1h"
max_active_sessions = 3
min_active_sessions = 0
model = "sonnet"
provider = "claude-headless"
# wa-cy6we: provider=claude-headless alone wasn't reliably beating the global
# remoteControlAtStartup=true (undocumented ordering between two --settings CLI
# flags) — see agents/gate-reviewer/agent.toml for the full rationale. overlay_dir
# writes the override into this session's own .claude/settings.json instead,
# which Claude Code's docs explicitly guarantee wins.
# ga-aijm2v.6: overlay próprio do revisor + TD_ROLE. Nega só as tools que o revisor MEDIU zero (Agent, ListAgents, CronDelete + o common);
# Monitor/TaskStop/ScheduleWakeup/Skill/Web*/AskUserQuestion/PushNotification/SendMessage FICAM (ele as usa: pool-roles.json, roles.reviewer._why).
# Skills enxutas (refino, browser-control, core.gc-*); plugins superpowers/frontend-design e CLAUDE.md/memória do Mayor OFF.
# Reverter: volte para .../pool e apague a linha env. Fonte: assets/claude-overlays/pool-roles.json.
overlay_dir = "packs/town-deltas/assets/claude-overlays/pool"  # REVERTIDO 26/09 (Mayor): o revisor roda na RAIZ da cidade, e o overlay pool-reviewer vazava pro .claude/settings.json da raiz e pro .gc/settings.json (gate-done off, CLAUDE.md excluido e memoria off pra TODAS as sessoes). Refazer so com workdir proprio do revisor.
env = { TD_ROLE = "reviewer" }
scope = "city"
wake_mode = "fresh"
