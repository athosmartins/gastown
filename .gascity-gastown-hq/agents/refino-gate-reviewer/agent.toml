idle_timeout = "1h"
max_active_sessions = 3
min_active_sessions = 0
model = "sonnet"
provider = "claude-headless"
# wa-cy6we: provider=claude-headless alone wasn't reliably beating the global
# remoteControlAtStartup=true (undocumented ordering between two --settings CLI
# flags) — see agents/gate-reviewer/agent.toml for the full rationale. overlay_dir
# writes the override into this session's own .claude/settings.json instead,
# which Claude Code's docs explicitly guarantee wins.
# ga-aijm2v.6: overlay próprio do revisor (só Bash/Read/Edit/Write; sem skills/plugins/CLAUDE.md do Mayor) + TD_ROLE.
# Reverter: volte para .../pool e apague a linha env. Fonte: assets/claude-overlays/pool-roles.json.
overlay_dir = "packs/town-deltas/assets/claude-overlays/pool-reviewer"
env = { TD_ROLE = "reviewer" }
scope = "city"
wake_mode = "fresh"
