idle_timeout = "1h"
max_active_sessions = 3
min_active_sessions = 0
model = "sonnet"
provider = "claude-headless"
# wa-cy6we: provider=claude-headless alone wasn't reliably beating the global
# remoteControlAtStartup=true (undocumented ordering between two --settings CLI
# flags) — see agents/gate-reviewer/agent.toml for the full rationale. overlay_dir
# writes the override into this session's own .claude/settings.json instead,
# which Claude Code's docs explicitly guarantee wins.
# ga-aijm2v.6 + ga-swnkfm + ga-3d1wno: overlay POR PAPEL do revisor (`pool-reviewer`) com work_dir PRÓPRIO e FIXO — mesma fiação do gate-reviewer,
# leia lá o porquê (o overlay vazou da raiz da cidade em 26/09) e a regra de nunca usar `{{.AgentBase}}` no work_dir do revisor. Dir próprio, separado do do gate-reviewer.
# Reverter: junto com o gate-reviewer, na ordem descrita lá (overlay .../pool, sem work_dir, manifesto city-root + wired_overlay); o selftest (C) reprova meio-revert.
overlay_dir = "packs/town-deltas/assets/claude-overlays/pool-reviewer"
work_dir = ".gc/agents/refino-gate-reviewer"
env = { TD_ROLE = "reviewer" }
scope = "city"
wake_mode = "fresh"
