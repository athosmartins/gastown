# ps-worker: ephemeral rig-scoped worker for property_scrapers beads.
# Mirrors wa-worker (the proven ephemeral pool). RIG CONTEXT comes from
# work_dir inside the property_scrapers rig clone:
#   - `bd` resolves to the PS bead store (ps-* prefix)
#   - `git` operates on the PS rig repo
# EPHEMERAL: min_active_sessions=0 → supervisor/Pilot spawns on demand;
# wake_mode=fresh → clean session per spawn; drains + exits after /gate-done.
# MODEL: Sonnet (build work; off the scarce Opus budget).
# PROVIDER: claude-headless (no mobile RC auto-connect — wa-9ye2 pattern).
work_dir = "/Users/athos/gt/property_scrapers/crew/worker"
min_active_sessions = 0
# max_active_sessions: originally 2. Cut to 1 on 2026-08-26 (Athos, multiple
# choice, ga-xsd03) as part of a citywide pool-ceiling reduction (wa-worker
# 4->2, gate-reviewer 6->3, ps-worker 2->1) to flatten a macOS swap-ratchet
# disk crisis that had already stalled the gate. ga-xsd03 closed confirming
# the cut is live and disk/swap stabilized — see agents/gate-reviewer/
# agent.toml's ga-5hdsr comment for the full history and how to raise it
# back once headroom is confirmed healthy again.
max_active_sessions = 1
idle_timeout = "2h"
wake_mode = "fresh"
model = "sonnet"
provider = "claude-headless"
# NOTE: dir= intentionally ABSENT (same rationale as wa-worker: keeps the agent
# city-discoverable for `gc session new ps-worker`; rig context comes from work_dir).
# ga-tkd2ll: verify the Claude Code credential is usable before this session
# spawns. Shadow mode by default (detects + alerts, never blocks) — see the
# script's own header for the staged-rollout rationale.
pre_start = ["/Users/athos/gt/.gascity-gastown-hq/scripts/claude-credential-preflight.sh"]
