# gate-reviewer-remote — o revisor do gate que roda no servidor Hetzner (ga-2hd02v.1.9)
#
# O mesmo revisor do `gate-reviewer`, mas a sessão abre no nó: o nome carrega `-remote-` (`gate-reviewer-remote-adhoc-<10>`), o
# `remote_match` do provider híbrido a manda ao `gc-session-ssh`, e ela roda num worktree do rig `gascity` no servidor. A TAREFA é a
# mesma do local, byte a byte (o dispatcher renderiza uma só); muda onde o Claude roda e o canal de volta. Quem escolhe entre os dois é
# o dispatcher (gate-remote-reviewers.lib.sh). INERTE: sem a flag $GC_CITY/.gc/gate-remote-reviewers.on ninguém abre este template.
# Ligar, provar e as decisões do Mayor: docs/runbooks/gate-reviewer-remote.md.
#
# max_active_sessions = 2, não 1: o nó tem teto 4 no total e o dog-remote ocupa 1; o run de código usa 1 revisor (ga-5hdsr), então 2 =
# dois runs ao mesmo tempo, com 1 vaga de folga. E 1 seria lido pelo guarda crew-session-dedup como sessão única e mataria o 2º start.
# min_active_sessions = 0 e nada de `gc hook` aqui: a sessão só existe porque o dispatcher a abriu para uma verdict bead; idle_timeout
# curto devolve a vaga do nó. work_dir, overlay_dir e env NÃO viajam (o provider os ignora): o revisor do nó não tem o overlay
# `pool-reviewer`, e a prova de equivalência de veredito (runbook) mede se isso muda o resultado.
#
# O atalho `bd` do nó não passa `bd label add|remove` nem `gc runtime drain-ack` (rc 77): o veredito volta por `bd comment` + `bd close`,
# caminho que o dispatcher já aceita (ga-86l90a8 PASS, ga-w7pm55 FAIL). Alargar o atalho é decisão de segurança do Mayor, não feita.
idle_timeout = "10m"
max_active_sessions = 2
min_active_sessions = 0
model = "sonnet"
provider = "claude-headless"
work_dir = ".gc/agents/gate-reviewer-remote"
scope = "city"
wake_mode = "fresh"
