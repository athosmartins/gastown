idle_timeout = "1h"
max_active_sessions = 3
min_active_sessions = 0
model = "sonnet"
provider = "claude-headless"
# wa-cy6we / Athos 2026-08-30 ("toda hora que eu espalho um gate reviewer...
# ele ta vindo com o controle remoto ligado"): provider=claude-headless alone
# was NOT enough — it injects remoteControlAtStartup:false via a SECOND
# --settings CLI flag, and Claude Code's own docs (settings.md, "Exceptions to
# managed settings precedence") only guarantee that key wins when it comes
# from .claude/settings.json or .claude/settings.local.json, not from an
# arbitrary --settings flag racing another one on the same command line.
# overlay_dir writes it into THIS session's own project-level
# .claude/settings.json at spawn time — the documented, guaranteed-to-win path.
overlay_dir = "packs/town-deltas/assets/claude-overlays/pool"
scope = "city"
wake_mode = "fresh"
