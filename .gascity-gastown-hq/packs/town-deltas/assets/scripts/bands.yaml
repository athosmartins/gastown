# bands.yaml — faixas estatísticas dos vigias (ga-4mzkfj9, Athos 28/11). Versionado: mudar uma faixa é um commit.
# Lido por bands.py com um leitor ESTRITO de subconjunto de YAML (o /usr/bin/python3 do mini não tem PyYAML). Chave desconhecida ou
# valor fora da faixa = erro, e erro deixa as faixas INERTES com a linha dizendo por quê (typo não desliga alarme em silêncio).
# O que cada chave faz e como instalar o tick: docs/runbooks/alarm-bands.md
version: 1

# Horas locais (BRT) em que nada interrompe ninguém. "off" desliga. Métrica com evaluate_in_silence: true segue sendo julgada.
silence: "22-07"

metrics:
  disk_free_delta:
    description: "queda do espaço livre do volume do Dolt e do swap, em MiB por hora. SÓ SOMBRA: os pisos fixos (dolt-disk-floor-guard e cia.) seguem agindo; isto conta o que as faixas diriam"
    mode: shadow
    driver: tick
    collector: disk_free_delta
    path: "/private/var/vm"
    direction: low
    unit: "MiB/h"
    min_sigma: 100
    baseline_days: 14
    min_baseline_points: 48
    fresh_for_h: 2
    recover_after_h: 3
    evaluate_in_silence: true
