# ─── gascity (HQ framework itself) ────────────────────────────────────────────
[[rig]]
name            = "gascity"
runtime_dir     = "/Users/athos/gt/.gascity-gastown-hq"
git_repo        = "/Users/athos/gt"
# The HQ framework scripts run IN PLACE from the repo working tree — there is no
# separate runtime clone, so the live scripts ARE the deployed versions the
# moment they exist on disk. Deploy therefore does NOT hard-fail on a git-pull of
# the town root (the root may legitimately carry unpushed local commits, which
# makes --ff-only fail and is not a deploy failure). It runs the idempotent
# bootstrap, which (re)establishes the skill-manifest baseline and ensures the
# periodic auditor launchd job is registered. A best-effort ff-pull is attempted
# but never fatal.
#
# ga-rhtu: the ff-pull targets `origin main` EXPLICITLY (not the branch's tracked
# upstream — that was found pointing at a stale `fork/main`, so a bare
# `pull --ff-only` could ff toward the fork and still miss the merge on
# origin/main). Because this best-effort pull can still fail to fast-forward
# (local-ahead / diverged town root), it is NOT trusted on its own: story-delivery.sh's
# post-deploy staleness gate (Step 4.5) re-verifies that the live HEAD CONTAINS
# origin/main after this command and HALTS delivery (no story:done) if it does
# not — so a silently-stale town root can never be marked done.
deploy_cmd      = "git -C /Users/athos/gt pull --ff-only origin main 2>/dev/null || true; /Users/athos/gt/.gascity-gastown-hq/scripts/skill-integrity-install.sh"
# crew-hang-detector (ga-khuz1): skill-integrity-install.sh (above) installs +
# loads its plist; this kickstart fires it immediately after each deploy so the
# prod-test sees a fresh startup marker.
daemon_restarts = ["com.gascity.skill-audit", "com.gascity.config-drift-watcher", "com.gascity.town-root-reconciler", "com.gascity.crew-hang-detector"]
prod_test_script = "/Users/athos/gt/.gascity-gastown-hq/packs/town-deltas/assets/prod-tests/gascity/run.sh"
min_deploy_gap_minutes = 5

