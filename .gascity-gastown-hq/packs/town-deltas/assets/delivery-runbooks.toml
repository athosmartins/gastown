# ─── gascity (HQ framework itself) ────────────────────────────────────────────
[[rig]]
name            = "gascity"
runtime_dir     = "/Users/athos/gt/.gascity-gastown-hq"
git_repo        = "/Users/athos/gt"
# The HQ framework scripts run IN PLACE from the repo working tree — there is no
# separate runtime clone, so the live scripts ARE the deployed versions the
# moment they exist on disk. Deploy therefore does NOT git-pull the town root
# (the root may legitimately carry unpushed local commits, which makes --ff-only
# fail and is not a deploy failure). It runs the idempotent bootstrap, which
# (re)establishes the skill-manifest baseline and ensures the periodic auditor
# launchd job is registered. A best-effort ff-pull is attempted but never fatal.
deploy_cmd      = "git -C /Users/athos/gt pull --ff-only 2>/dev/null || true; /Users/athos/gt/.gascity-gastown-hq/scripts/skill-integrity-install.sh"
daemon_restarts = ["com.gascity.skill-audit"]
prod_test_script = "/Users/athos/gt/.gascity-gastown-hq/packs/town-deltas/assets/prod-tests/gascity/run.sh"
min_deploy_gap_minutes = 5

