# delivery-runbooks.toml — Machine-readable per-rig deploy runbooks.
#
# Read by story-delivery.sh. Each [[rig]] entry defines:
#   name            — matches city.toml rig name
#   runtime_dir     — the deployed worktree / git clone that runs in production
#   git_repo        — source of truth git repo (bare or clone) used for ff-push
#   deploy_cmd      — shell command to deploy: pulls runtime_dir to current HEAD.
#                     MUST be idempotent. Runs as the launchd user.
#   daemon_restarts — list of launchd label strings to ALWAYS kickstart after
#                     deploy (static, unconditional). Empty list = none.
#   sensitive_daemons — (ga-iwv0) launchd-label SUBSTRINGS for long-lived
#                     hot-path daemons that must NEVER be auto-bounced (live
#                     send / inbound routing / scheduling — in-flight work must
#                     drain first). story-delivery.sh's daemon-refresh step
#                     auto-restarts SAFE (read-only dashboard) daemons whose
#                     code this deploy changed and verifies they came up fresh;
#                     any AFFECTED daemon matching one of these substrings is
#                     instead FLAGGED for a guarded restart and HALTS delivery
#                     (story:done withheld) so dormant hot-path code is never
#                     silently marked done. Empty list = treat all as safe.
#                     (ga-ylr2m) This is a hand-maintained COPY, and copies
#                     drift — it used to omit daemons WA's own, stricter
#                     $runtime_dir/daemons/restart_policy.yaml already locked
#                     to notify-only. daemon-refresh.sh now reads that file
#                     DIRECTLY when the rig ships one, treating any daemon
#                     not explicitly in its 'auto'/'deploy_restart' as
#                     sensitive too — this list and that file are a UNION
#                     (either one calling a daemon sensitive makes it
#                     sensitive), so this field stays useful for rigs (or
#                     daemons) that have no restart_policy.yaml of their own.
#   prod_test_script — absolute path to a shell script that exits 0 on pass,
#                     non-zero on failure. If absent, delivery halts with
#                     "no prod test — cannot mark done".
#   min_deploy_gap_minutes — don't redeploy if last deploy was < N minutes ago.
#
# Safety: story-delivery.sh NEVER auto-reverts. On failure it halts + escalates.

# ─── property_scrapers ────────────────────────────────────────────────────────
[[rig]]
name            = "property_scrapers"
runtime_dir     = "/Users/athos/.property-scrapers/runtime/main"
git_repo        = "/Users/athos/gt/property_scrapers/.repo.git"
# Deploy = fast-forward pull on the runtime clone.
# The runtime is a normal git clone of github.com/athosmartins/property_scrapers.
# No daemon restart required: runner.py reads SCRAPERS.keys() at startup via
# --scraper all; the daily launchd job already points at this runtime_dir.
deploy_cmd      = "git -C /Users/athos/.property-scrapers/runtime/main pull --ff-only"
daemon_restarts = []   # launchd com.scrapers.daily fires on schedule; no restart needed
prod_test_script = "/Users/athos/gt/.gascity-gastown-hq/packs/town-deltas/assets/prod-tests/property_scrapers/run.sh"
min_deploy_gap_minutes = 5

# ─── whatsapp_automation ─────────────────────────────────────────────────────
[[rig]]
name            = "whatsapp_automation"
runtime_dir     = "/Users/athos/gt/whatsapp_automation"
git_repo        = "/Users/athos/gt/whatsapp_automation"
# Self-repo rig: git pull on the repo root.
deploy_cmd      = "git -C /Users/athos/gt/whatsapp_automation pull --ff-only"
daemon_restarts = []   # WA worker managed by gc session; no STATIC launchd restart
# ga-iwv0: the daemon-refresh step auto-restarts affected SAFE dashboards after
# deploy + verifies freshness. These hot-path daemons (live send, inbound
# webhook routing, slot scheduling, conversation monitoring) are NEVER
# auto-bounced — they are flagged for a guarded restart (drain first) and halt
# delivery if their code changed, so dormant hot-path code can't be marked done.
#
# ga-3xq0u: this list defaults OPEN (unlisted = safe to auto-bounce) while WA's
# OWN registry — daemons/restart_policy.yaml — defaults CLOSED ("Default
# (não-listado) = manual (notify-only)", its line 2) and only promotes a daemon
# to auto-restart after a named, adversarially-reviewed justification. The two
# registries are unintegrated (daemon-refresh.sh reads neither restart_policy.yaml
# nor restart_guard_scripts:), so any WA daemon NOT yet added here defaults to
# "safe" from gascity's side even when WA's own review says otherwise. Confirmed
# LIVE in story-delivery.log: daemon-refresh.sh has auto-kickstarted 4 of the 6
# names added below multiple times (frota-dashboard + demand-dashboard together
# on 2026-07-30 14:19:26Z; campaign-dashboard on 06-29/07-16/07-30/08-13) despite
# restart_policy.yaml explicitly classifying all of them notify_only_locked or
# vetoing them from auto — i.e. this gap has already bypassed a deliberate human
# safety lock in production, not just a theoretical risk. Added here from
# restart_policy.yaml's current notify_only_locked list + CRITICAL_LAUNCHD_JOBS
# vetoes + the new send-in-flight guard (classification_dashboard_restart_safe.py,
# wa-mlsc0) that only WA's OWN restart path consults — gascity's binary
# safe/sensitive model can't express "safe only when idle", so the conservative
# choice is sensitive until daemon-refresh.sh can consult restart_guard_scripts
# too (tracked follow-up, see ga-3xq0u decision comment for the structural fix:
# derive this list FROM restart_policy.yaml instead of hand-copying it, so the
# two registries can't drift again).
sensitive_daemons = ["central-sender", "webhook-receiver", "slot-scheduler", "conversation-monitor", "campaign-dashboard", "clientes-dashboard", "map-viewer", "frota-dashboard", "demand-dashboard", "daemon-health-monitor", "classification-dashboard"]
# ga-857v FIX 2: rig-level smoke harness — asserts painel :8202 (200 + title +
# SSTI closed) and the admin :8097 registration. WA deliveries now reach
# story:done with delivery:tested instead of the ga-dqp interim delivery:untested.
prod_test_script = "/Users/athos/gt/.gascity-gastown-hq/packs/town-deltas/assets/prod-tests/whatsapp_automation/run.sh"
min_deploy_gap_minutes = 5

