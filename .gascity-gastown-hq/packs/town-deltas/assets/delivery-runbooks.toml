# delivery-runbooks.toml — Machine-readable per-rig deploy runbooks.
#
# Read by story-delivery.sh. Each [[rig]] entry defines:
#   name            — matches city.toml rig name
#   runtime_dir     — the deployed worktree / git clone that runs in production
#   git_repo        — source of truth git repo (bare or clone) used for ff-push
#   deploy_cmd      — shell command to deploy: pulls runtime_dir to current HEAD.
#                     MUST be idempotent. Runs as the launchd user.
#   daemon_restarts — list of launchd label strings to kickstart after deploy.
#                     Empty list means no daemon restart needed.
#   prod_test_script — absolute path to a shell script that exits 0 on pass,
#                     non-zero on failure. If absent, delivery halts with
#                     "no prod test — cannot mark done".
#   min_deploy_gap_minutes — don't redeploy if last deploy was < N minutes ago.
#
# Safety: story-delivery.sh NEVER auto-reverts. On failure it halts + escalates.

# ─── property_scrapers ────────────────────────────────────────────────────────
[[rig]]
name            = "property_scrapers"
runtime_dir     = "/Users/athos/.property-scrapers/runtime/main"
git_repo        = "/Users/athos/gt/property_scrapers/.repo.git"
# Deploy = fast-forward pull on the runtime clone.
# The runtime is a normal git clone of github.com/athosmartins/property_scrapers.
# No daemon restart required: runner.py reads SCRAPERS.keys() at startup via
# --scraper all; the daily launchd job already points at this runtime_dir.
deploy_cmd      = "git -C /Users/athos/.property-scrapers/runtime/main pull --ff-only"
daemon_restarts = []   # launchd com.scrapers.daily fires on schedule; no restart needed
prod_test_script = "/Users/athos/gt/.gascity-gastown-hq/packs/town-deltas/assets/prod-tests/property_scrapers/run.sh"
min_deploy_gap_minutes = 5

# ─── whatsapp_automation ─────────────────────────────────────────────────────
[[rig]]
name            = "whatsapp_automation"
runtime_dir     = "/Users/athos/gt/whatsapp_automation"
git_repo        = "/Users/athos/gt/whatsapp_automation"
# Self-repo rig: git pull on the repo root.
deploy_cmd      = "git -C /Users/athos/gt/whatsapp_automation pull --ff-only"
daemon_restarts = []   # WA worker managed by gc session; no launchd restart
# ga-857v FIX 2: rig-level smoke harness — asserts painel :8202 (200 + title +
# SSTI closed) and the admin :8097 registration. WA deliveries now reach
# story:done with delivery:tested instead of the ga-dqp interim delivery:untested.
prod_test_script = "/Users/athos/gt/.gascity-gastown-hq/packs/town-deltas/assets/prod-tests/whatsapp_automation/run.sh"
min_deploy_gap_minutes = 5

