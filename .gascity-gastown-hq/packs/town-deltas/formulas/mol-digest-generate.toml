# town-deltas override (ga-8f40w): the embedded formula archived each digest
# via `gc bd create --type=task`, and no step ever closed it. Digest beads are
# informational-only (one specific day's report; once the day ends there is no
# pending action), but issue_type=task put them literally in the Pilot dispatch
# queue and in the panel's Aprovadas column (painel_visibilidade.py's Aprovadas
# = story:approved + bug/chore/task auto-dispatched) — fake work offered to a
# builder, then never closing meant unbounded accumulation (21 stale digests
# measured back to 2026-06-20). Fix: archive as --type=message (the type
# already used for the pre-existing digest wisps, never task/bug/chore) and
# close it immediately in the same step — a digest has no lifecycle to hold
# open. See packs/town-deltas/orders/digest-sweep.toml for the backstop that
# catches any digest left open regardless of producer or issue_type.
# Script vendored nowhere — this formula has no exec script, only agent-read
# step descriptions, so the whole file is copied here (same recipe as
# gate-sweep's vendor-and-override, applied to a formula instead of an order).
#
# Follow-up (ga-4tt37, 2026-08-13): the ga-8f40w fix above stops the type at
# the RECIPE level but nothing verified the EXECUTING step actually followed
# it — 3 post-fix runs (ga-wisp-olhjbwh, ga-ch6hk, ga-v6ti6 before a live
# manual correction) still produced issue_type=task, left open, each time
# with a close_reason on the work bead that falsely claimed the archive had
# succeeded (same false-verification class as ga-8h185, this step's
# mail-send sub-action). Confirmed via Dolt commit-history forensics
# (dolt_diff_issues / AS OF, not guessed) that at least one instance
# (ga-wisp-olhjbwh) had issue_type=task from its OWN creation commit — the
# type was never message to begin with, ruling out a later mutation for
# that case. generate-and-send's step description now requires an explicit
# `bd show`-based verify-and-self-correct after both the mail-send and the
# archive sub-actions, before either is cited as done in a close_reason.
# Also fixed in the same pass: digest-sweep.sh's `bd list` was missing
# --include-infra, so it could never see (and thus never sweep) a digest
# left open with the CORRECT type (message is an infra type, hidden from
# plain `bd list` even with --all) — confirmed live, 774 open message-type
# beads invisible without the flag. That gap made the backstop's own
# "catches ANY open digest regardless of issue_type" header comment false
# for exactly the type this fix produces.
#
# Follow-up (ga-cke56, 2026-08-28): even with the ga-4tt37 fix landed (type
# correctly ends up "message", closed same-step), the digest bead was still
# LOST within about a day. `gc bd create --type=message ...` (no
# --storage-class flag anywhere in this recipe) creates an EPHEMERAL wisp
# (`ga-wisp-*` id, `ephemeral:true` in its JSON) — confirmed this is bd's
# own per-type default on this install, not a city config override
# (`bd config get storage-class.message` -> "not set in config.yaml").
# mol-dog-reaper purges closed wisps past purge_age, so "archived as a
# digest bead" (this file's own top-of-file description, unchanged since
# before ga-8f40w) was never true for a message-typed digest. Confirmed two
# ways: the digest cited in the bug report (`ga-wisp-0fphfl`, closed
# 2026-08-27T17:43:25Z) is gone from the live DB as of this fix ("no issue
# found"); the one instance still alive when this fix landed
# (`ga-wisp-r4d1hb`, "Digest: 2026-08-27") was promoted by hand alongside
# this recipe change, so it isn't lost too.
# Tried and REJECTED first: passing --storage-class versioned on the
# original `gc bd create` call, hoping to skip the ephemeral path entirely.
# Empirically falsified in an isolated throwaway `bd init` sandbox (never
# trust the flag's own --help text alone) — the created bead still came
# back `ephemeral:true`; the per-type ephemeral default appears to win
# regardless of an explicit --storage-class override at create time on this
# bd version. What DOES work, confirmed in the same sandbox (create
# ephemeral wisp -> close -> `bd promote` -> re-check): `bd promote`
# reliably clears `ephemeral` while preserving status, labels, and the
# original id (a promoted digest keeps its `wisp-`-shaped id forever —
# cosmetic only, not a sign promotion failed). Fix: promote the digest
# right after the existing type/status verify-and-self-correct block below,
# with its own verify-and-self-correct in the same style — same "don't
# claim success you didn't check" discipline as the mail-send and
# type/status sub-actions.
#
# Follow-up (ga-c6yys3, 2026-09-14): determine-period computed SINCE/UNTIL
# from wall-clock "now" at the moment the step *executed*, not from
# anything tied to the day it was actually meant to cover. When execution
# lagged the order-run's creation by hours (44h in the incident that filed
# this bug), the window silently drifted: one calendar day was never
# digested (2026-09-12), and the very next on-schedule run then computed
# the IDENTICAL window the late one had just sent (since=2026-09-13/
# until=2026-09-14, both times) — a duplicate digest to the mayor within
# minutes, caught and suppressed by hand that one time (see ga-c6yys3's
# comments), not by the recipe. Fix: anchor SINCE to the UNTIL of the last
# digest actually archived (new digest.since/digest.until metadata on the
# archived bead, step 3 below; falls back to parsing an older digest's
# "Digest: YYYY-MM-DD" title for beads archived before this fix), never to
# wall-clock time at execution. UNTIL is still capped at "today 00:00 UTC"
# so a run never claims a day that hasn't finished yet, and a run that
# finds nothing new past the last digest closes itself — and the rest of
# the molecule — as a no-op instead of re-sending. Wall-clock is now used
# only for that upper cap, never as the anchor, so an arbitrarily late
# execution can no longer produce the wrong window, only a later one.
#
# Follow-up (ga-c6yys3, gate-fix-attempt 2, 2026-09-14): the paragraph
# above claimed capping UNTIL at TODAY_FLOOR only ever produces "a later"
# window, never a wrong one — false for any {{period}} longer than a
# single day. Gate feedback (gate_run=ga-7bi03j): once SINCE lands within
# PERIOD_DAYS of today, the cap silently shortens UNTIL below a full
# period instead of waiting for one to elapse, and that short UNTIL then
# becomes the next run's SINCE — so a weekly digest dispatched more often
# than every 7 days (routine during catch-up after a stall, which step 3's
# own comment already treats as expected) degrades permanently into daily
# windows mislabeled "weekly," every run, forever, the same silent-drift
# failure class this fix exists to eliminate. PERIOD_DAYS=1 never showed
# this because its capped candidate lands exactly on TODAY_FLOOR, which by
# then already equals SINCE — step 4's nothing-new guard caught that case
# by coincidence, not by design. Fix: a capped (not-yet-elapsed) candidate
# now sets UNTIL=SINCE instead of UNTIL=TODAY_FLOOR, so step 4's existing
# guard closes the run as a no-op instead of sending a partial period, and
# $SINCE (never archived) is unchanged for the next run to re-evaluate.
# Cold start's SINCE is now anchored PERIOD_DAYS back (was hardcoded one
# day back regardless of period) — required by the same change: an
# unanchored weekly cold start would otherwise always compute a
# not-yet-elapsed candidate, always defer, and never send a first digest.
#
# Follow-up (ga-hnlog4, 2026-09-26): two recipe defects found running the
# 2026-09-25 digest, both measured. (1) Step 3a read session lifecycle through
# `gc events`, which returns only the newest 500 rows (warning on stderr only,
# no paging flag): 81 woke / 161 stopped reported against 539 / 404 real, and
# through `| jq` a failed call ("context deadline exceeded") read as "0". 3a
# now counts from the event-log segments (live file + archives stamped at or
# after SINCE, dedupe on seq), now also counts session.crashed (the old note
# calling that type non-existent was a capped-CLI artifact), and prints N/A —
# never 0 — when it cannot list or read a segment, cannot reach back to SINCE,
# or finds a hole in the chain of segment seq ranges (a deleted middle archive
# or a rotation between listing and reading would otherwise undercount with
# full confidence). (2) Step 3's `--metadata` JSON was typed with
# backslash-escaped quotes; this file's TOML string consumed that escape level,
# so the agent received invalid JSON (the 2026-09-25 archive bead only stored
# correctly because the dog re-escaped by hand). The JSON is now built with
# `jq --arg`, so no escape level matters. The recipe text is what the agent is
# delivered, so assets/mol-digest-generate.selftest.sh tests the TOML-parsed
# text, not this source. Known sibling NOT fixed here: step 2's
# `gc events --since=5m --type=mail.sent | tail -5` also masks gc's exit status.
description = """
Generate activity digest for the mayor.

This is a **periodic formula** — dispatched by the deacon's
`periodic-formulas` step when the cooldown trigger elapses. Configured
in `city.toml` under `[formulas]`:

```toml
[[formulas.periodic]]
formula = "mol-digest-generate"
trigger = "cooldown"
interval = "24h"
pool = "dog"
```

The deacon checks if enough time has passed since the last run
(tracked via `type:order-run` beads), pours a wisp, and labels it
for the dog pool. A dog picks it up and runs this formula.

## What it produces

A formatted markdown digest covering:
- Issues filed and closed (by rig, by type)
- Commit activity
- Incidents and escalations
- Agent health summary
- Trends (backlog direction, throughput)

The digest is mailed to the mayor and archived as a digest bead.

Read each step's description before acting — Config values override defaults."""
formula = "mol-digest-generate"
version = 2
contract = "graph.v2"

[vars]
[vars.period]
description = "The digest period type (daily, weekly)"
default = "daily"

[vars.event_timeout]
description = "Seconds to wait for slow queries before giving up"
default = "30"

[[steps]]
id = "determine-period"
title = "Determine digest time range"
description = """
Establish the time range for this digest.

**1. Determine period type:**
Use {{period}} (from formula vars, defaults to "daily"). Derive the
period length in days, used throughout this step:
```bash
case "{{period}}" in
  weekly) PERIOD_DAYS=7 ;;
  *)      PERIOD_DAYS=1 ;;
esac
```

**2. Anchor SINCE to the last digest actually archived — never to
wall-clock "now" at step-execution time (ga-c6yys3, 2026-09-14).**

The old recipe computed SINCE/UNTIL as "yesterday/today relative to right
now." That silently breaks whenever this step runs late relative to the
day it was meant to cover: a stalled molecule (44h late in the incident
that filed ga-c6yys3) computes a window relative to its OWN delayed
execution time. Two failures from that one cause, observed live in a
single incident: one calendar day silently never digested (2026-09-12),
and, minutes after the stalled chain finally sent late, the very next
on-schedule run computing the IDENTICAL window again (both:
since=2026-09-13, until=2026-09-14) — a duplicate digest to the mayor,
caught and suppressed by hand that one time, not by the recipe. Anchor to
durable state instead, so the window is correct no matter how late this
step runs:

```bash
# No 2>/dev/null on this call (unlike its siblings below) — a real failure
# here must be visible, not silenced, so it can't be mistaken for the
# legitimate "no prior digest exists" case checked for next.
LATEST_JSON=$(gc bd list --label="digest,{{period}}" --include-infra --all --json --limit=0)
LIST_STATUS=$?
LOOKUP_OK=false
if [ "$LIST_STATUS" -eq 0 ] && printf '%s' "$LATEST_JSON" | jq -e 'type == "array"' >/dev/null 2>&1; then
  LOOKUP_OK=true
fi
LAST=""
LAST_UNTIL=""
if [ "$LOOKUP_OK" = true ]; then
  LAST=$(printf '%s' "$LATEST_JSON" | jq -c 'sort_by(.created_at) | reverse | .[0] // empty')
  if [ -n "$LAST" ]; then
    LAST_UNTIL=$(printf '%s' "$LAST" | jq -r '.metadata["digest.until"] // empty')
    if [ -z "$LAST_UNTIL" ]; then
      # Pre-fix digest — no digest.since/digest.until metadata yet. Recover
      # the same value from its title ("Digest: YYYY-MM-DD" is the day it
      # covered; UNTIL is that day + PERIOD_DAYS — same math as step 3).
      LAST_DATE=$(printf '%s' "$LAST" | jq -r '.title // empty' | sed -E 's/^Digest: //')
      if [ -n "$LAST_DATE" ]; then
        LAST_UNTIL=$(date -u -d "$LAST_DATE + $PERIOD_DAYS day" +%Y-%m-%dT00:00:00Z 2>/dev/null || \
                     date -u -j -v+${PERIOD_DAYS}d -f '%Y-%m-%d' "$LAST_DATE" +%Y-%m-%dT00:00:00Z)
      fi
    fi
  fi
fi
```

**If `$LOOKUP_OK` is not `true`:** the lookup failed (non-zero exit — see
the error printed above) or returned something that isn't a confirmed
JSON array. That is a different case from a confirmed-empty history
(`[]`, a legitimate cold start, handled in step 3 below) — collapsing the
two was exactly the gate feedback on this fix's first attempt (ga-c6yys3):
falling through to cold-start on a query failure would silently reset
SINCE to "yesterday" and skip any real, older history with no error,
count, or signal, the exact failure class this fix exists to eliminate,
just triggered by a failed query instead of wall-clock drift. Do not
proceed to step 3. Instead:

```bash
gc bd comment <this-step-bead-id> "determine-period: prior-digest lookup ('gc bd list --label=digest,{{period}} ...') failed or returned a non-array result (exit=$LIST_STATUS) — cannot distinguish 'no prior digest exists' from 'query failed.' Not closing this step; leaving in_progress for retry."
gc runtime drain-ack && exit
```

Leaving the step open (not closed) lets the existing reclaim/redispatch
cycle retry it fresh instead of this step guessing a window it can't
confirm.

**3. Compute SINCE/UNTIL/DATE:**

```bash
# Exact midnight, not "today 00:00" parsed through date -d/-j (that idiom
# leaves seconds unset on this install's BSD date, drifting ~20-30s past
# :00 — harmless for the old UNTIL-only use, but this value is now also
# compared for exact equality in step 4 below, where that drift would
# leak a spurious few-second "new" window instead of correctly detecting
# none). Formatting today's date and appending fixed T00:00:00Z sidesteps
# the parse entirely and needs no GNU/BSD fallback.
TODAY_FLOOR="$(date -u +%Y-%m-%d)T00:00:00Z"
if [ -n "$LAST_UNTIL" ]; then
  SINCE="$LAST_UNTIL"
else
  # True cold start only — no prior digest bead found at all (the label
  # filter above matched nothing, e.g. a brand-new city). Every later run
  # anchors on $LAST_UNTIL above instead; this branch should fire at most
  # once ever, per city. Anchored $PERIOD_DAYS back, not a hardcoded one
  # day (gate-fix-attempt 2, ga-c6yys3): a fixed "-1d" made UNTIL_CANDIDATE
  # below land 6 days past TODAY_FLOOR on every weekly cold start, which
  # after this same fix's capping change (step 3 below) always defers —
  # and since nothing gets archived on a deferred run, the next run
  # recomputes the identical one-day-back SINCE relative to its own later
  # "now," never converging. Anchoring PERIOD_DAYS back instead makes
  # UNTIL_CANDIDATE land exactly on TODAY_FLOOR — a full period, sent
  # immediately, same as before this change for the daily case
  # (PERIOD_DAYS=1 reproduces the old "-1d" exactly). Same exact-midnight
  # idiom as TODAY_FLOOR above, for the same reason (date -d/-j 'N days
  # ago 00:00' drifts a few seconds past :00 on this install's BSD date).
  SINCE="$(date -u -v-${PERIOD_DAYS}d +%Y-%m-%d 2>/dev/null || date -u -d "${PERIOD_DAYS} days ago" +%Y-%m-%d)T00:00:00Z"
fi
UNTIL_CANDIDATE=$(date -u -d "$SINCE + $PERIOD_DAYS day" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
  date -u -j -v+${PERIOD_DAYS}d -f '%Y-%m-%dT%H:%M:%SZ' "$SINCE" +%Y-%m-%dT%H:%M:%SZ)
# A run must cover a FULL $PERIOD_DAYS window or none at all — never a
# short one (gate-fix-attempt 2, ga-c6yys3). Capping a not-yet-elapsed
# candidate down to TODAY_FLOOR (the prior version of this fix) silently
# produces a shorter-than-$PERIOD_DAYS window whenever this step runs more
# than once per $PERIOD_DAYS while catching up — routine for a weekly
# digest dispatched off a shorter cooldown, per step 3's own comment
# above. Once SINCE lands within $PERIOD_DAYS of today, every subsequent
# catch-up run would re-anchor SINCE close to today and get capped again,
# permanently degrading "weekly" into daily digests under a weekly label.
# $PERIOD_DAYS=1 never showed this: its capped candidate lands exactly on
# TODAY_FLOOR, which by then already equals SINCE, so step 4's guard below
# already caught it — coincidence, not design. Generalize that same
# protection to any $PERIOD_DAYS: when a full period hasn't elapsed yet,
# set UNTIL=SINCE (not TODAY_FLOOR) so step 4 closes this run as a no-op
# instead of sending a partial period. $SINCE is never archived in that
# branch, so the next run (once enough wall-clock time has actually
# passed) re-anchors to the same $LAST_UNTIL and re-evaluates, rather than
# drifting forward on a window that was never really sent. When a full
# period HAS elapsed, this still advances by exactly one period per run,
# same as before — a multi-day/week backlog still catches up one period
# per later run, until caught up.
if [[ "$UNTIL_CANDIDATE" > "$TODAY_FLOOR" ]]; then
  UNTIL="$SINCE"
else
  UNTIL="$UNTIL_CANDIDATE"
fi
DATE=${SINCE%%T*}
```

`$SINCE`/`$UNTIL`/`$DATE` stay valid for the rest of this molecule as long
as the same session continues (the normal case). If you're resuming a
stalled molecule in a fresh session instead, re-run this step's bash
before trusting any of the three.

**4. Nothing-new guard.** If `$SINCE` is not strictly before `$UNTIL`, there
is nothing to send this run — either the last digest already covers
everything there is to cover right now (the exact near-miss described
above), or step 3 set `UNTIL=$SINCE` because a full `{{period}}` period
hasn't elapsed since `$SINCE` yet (gate-fix-attempt 2, ga-c6yys3). Do not
collect data or send mail either way — a caller diagnosing a "why hasn't
this digest fired" report should check `$LAST_UNTIL` vs `$TODAY_FLOOR`
above to tell the two cases apart, not assume it's always the former:

```bash
if [[ "$SINCE" > "$UNTIL" || "$SINCE" == "$UNTIL" ]]; then
  gc bd close <this-step-bead-id> --reason "Nothing new to cover — last digest through $SINCE, and either that's still current or a full {{period}} period hasn't elapsed since (ga-c6yys3). Skipping rest of this molecule as no-ops."
fi
```

If you hit that branch: do not proceed to collect-data. Look up your root
bead (`gc bd show <this-step-bead-id> --json | jq -r '.[0].metadata["gc.root_bead_id"]'`),
then `gc bd mol current <root-bead-id>` and close every step it reports as
`[ready]`, one at a time (closing one unblocks the next), with the same
reason, until none remain — collect-data and generate-and-send must NOT
collect data or send mail in this branch. Then `gc runtime drain-ack &&
exit`.

Otherwise, note the timestamps for the digest header and close this step
when the time range is established — state the computed values in the
close reason, e.g. "Time range established: {{period}} digest,
since=$SINCE until=$UNTIL"."""

[[steps]]
id = "collect-data"
title = "Collect activity data from all rigs"
needs = ["determine-period"]
description = """
Gather activity data from each rig.

**1. List rigs:**
```bash
gc rig list
```

**2. For each rig, collect:**

a) **Issues filed and closed** — bounded on BOTH ends, [SINCE, UNTIL), AND
per-rig scoped like every other sub-item below it (ga-c2tv3l, 2026-09-01): a
prior version of this query ran bare `gc bd list`, no `-C`, unlike 2b/2c and
every other "for each rig" sub-item in this step. Bare `gc bd` resolves its
database by auto-discovery from the CWD — for this formula's own execution
directory (a dog's home dir under .gascity-gastown-hq) that's HQ/gascity, so
every non-HQ rig's Filed/Closed columns in the digest's "By Rig" table were
silently reading HQ's own counts instead of that rig's, every run, since this
formula existed. Reproduced live 2026-08-28 (see this bead's comments) before
this fix landed. Same mechanism `ga-2c2daa` already confirmed and fixed for
2c/3b — this was the one sibling sub-item it missed. The filed-count query
needs `--all`: `bd list` with no `--status`/`--all` flag silently excludes
anything already closed by query time, so any issue created in-window but
since closed (common for this rig's own same-day chore/session/step/molecule
bookkeeping beads) vanishes from the count — same reason item 2c below
carries `--all`. The closed-count query is unaffected; it already passes
`--status=closed` explicitly:
```bash
RIG_PATH=<rig-path>   # from `gc rig list`, one rig at a time — see 2b's commit loop
gc bd -C "$RIG_PATH" list --all --created-after=$SINCE --created-before=$UNTIL --json --limit=0
gc bd -C "$RIG_PATH" list --status=closed --closed-after=$SINCE --closed-before=$UNTIL --json --limit=0
```

b) **Commit activity** — also bounded, or today's not-yet-elapsed commits
bleed in. **Not `--merges`:** this city's gate workflow (`/gate-done` →
autonomous dispatcher) lands via fast-forward/squash, never a 2-parent merge
commit — a `--merges` query returns **0** here structurally, on every rig,
always (confirmed live 2026-08-21, ga-x3b4ro: a 14+64-real-commit day still
measured 0 merges — a digest reporting "Merges: 0" reads as "nothing shipped"
when the opposite is true). Count plain commits instead, scoped correctly per
rig:

```bash
RIG_PATH=<rig-path>   # from `gc rig list`
TOPLEVEL=$(git -C "$RIG_PATH" rev-parse --show-toplevel 2>/dev/null)
if [ -z "$TOPLEVEL" ]; then
  # rev-parse --show-toplevel fails on some worktrees (property_scrapers,
  # lexbh — a `.git` file points at a sibling `.repo.git` without full
  # worktree registration) even though the repo is perfectly readable —
  # `git log` only needs the git-dir, not the worktree, so it silently
  # returns a correct (not a loud-failing) answer either way. Use the
  # explicit form so correctness doesn't depend on that per-subcommand
  # accident; these two rigs are standalone repos, so no pathspec needed.
  LOG_OUT=$(git --git-dir="$RIG_PATH/.repo.git" --work-tree="$RIG_PATH" \
    log --since=$SINCE --until=$UNTIL --oneline main)
elif [ "$TOPLEVEL" = "$RIG_PATH" ]; then
  # standalone repo, the rig IS the toplevel (marketing, whatsapp_automation)
  LOG_OUT=$(git -C "$RIG_PATH" log --since=$SINCE --until=$UNTIL --oneline main)
else
  # rig is a subdirectory of a bigger shared repo — gascity, gastown, and
  # deacon all resolve to the SAME toplevel (/Users/athos/gt), so an
  # unscoped count here would be town-wide, not per-rig. Scope to just
  # this rig's subtree via pathspec (verified 2026-08-21: per-subtree
  # counts sum exactly to the town-wide total across a 3-week sample, no
  # cross-subtree overlap found — though a single commit touching two
  # rigs' subtrees at once is structurally possible and would double-
  # count across rigs if it ever happens; not observed so far).
  REL=${RIG_PATH#$TOPLEVEL/}
  LOG_OUT=$(git -C "$TOPLEVEL" log --since=$SINCE --until=$UNTIL --oneline main -- "$REL")
fi
# Check git log's own exit status IMMEDIATELY, with NO pipe in between —
# gate-fix history (ga-x3b4ro attempt 1): a prior version of this fix piped
# straight into `| wc -l | tr -d ' '` and checked `$?` after that, but wc/tr
# succeed unconditionally no matter what git log did upstream, so `$?` there
# reflected tr's status, not git log's (reproduced live: `COMMIT_COUNT=$(false
# | wc -l | tr -d " "); echo "$COMMIT_COUNT $?"` prints "0 0", identical to
# the genuine-zero case) — the exact bug this fix exists to prevent,
# reproduced one level down inside its own fix. Capturing raw output into
# LOG_OUT first sidesteps the pipe entirely: POSIX defines an `if/elif/else`
# block's own exit status as the status of the last command run in whichever
# branch executed, which here is always the `LOG_OUT=$(git ... log ...)`
# assignment — so the `$?` below is always git log's real exit status.
if [ $? -ne 0 ]; then
  COMMIT_COUNT="?"
elif [ -z "$LOG_OUT" ]; then
  COMMIT_COUNT=0
else
  COMMIT_COUNT=$(printf '%s\n' "$LOG_OUT" | wc -l | tr -d ' ')
fi
```

**A failed `git log` above renders `COMMIT_COUNT="?"`, never `0`** — a failed
command and a genuinely quiet rig must never collapse into the same number.
If a rig shows `?` in the table, say so in Highlights instead of asserting
no activity happened.

c) **Incidents** — per rig, bounded [SINCE, UNTIL), including closed beads (many
incidents are filed and resolved within minutes — `--all` is required or they're
invisible even inside a correctly-bounded date range):
```bash
RIG_PATH=<rig-path>   # from `gc rig list`, one rig at a time — see 2b's commit loop
gc bd -C "$RIG_PATH" list --label=incident --all --created-after=$SINCE --created-before=$UNTIL --json --limit=0
```
The `incident` label is real and in live use — e.g. `ps-t80` (property_scrapers,
filed and closed within 5 seconds, 2026-05-20) — just lightly used and scattered
per-rig, never visible from one city-wide view. A prior version of this recipe
checked only the unscoped `gc bd list` (no `-C`, resolves to HQ/gascity only) and
generalized that single rig's zero into a permanent "zero, ever, city-wide, never
recheck" claim — gate-failed for exactly this (ga-2c2daa, 2026-08-22): every rig
has its own separate bd database (confirmed via `gc rig list` + direct `-C`
queries), so a city-wide answer needs the per-rig loop above, every run. Expect
most days to genuinely read 0 — that's a real quiet day, not evidence the label
is unused. If any rig's query fails, say so and report N/A for that rig rather
than treating a query failure as zero — same rule as the Escalations query
below.

d) **Restore-verify (integridade do backup Dolt)** — ga-jz7gg: verificação
semanal automatizada que restaura cada backup Dolt para um diretório
temporário, compara a contagem de issues contra o banco vivo, e apaga a
cópia. Roda só aos domingos 05:00 (`com.gascity.dolt-restore-verify`,
escopado a gascity/HQ apenas — diferente de Incidentes/Escalações acima,
NÃO é per-rig, então não precisa do loop):
```bash
gc bd -C "/Users/athos/gt/.gascity-gastown-hq" list --label=restore-verify --all --created-after=$SINCE --created-before=$UNTIL --json --limit=0
```
Uma execução limpa fecha o próprio bead na hora (`type=chore`); uma falha
fica ABERTA (`type=bug`, roteada para `gastown.dog`) — então qualquer
resultado aberto com esse label dentro da janela é, por si só, digno de
Highlights, independente de quantos outros houve.

**Silêncio aqui não é "tudo limpo" — é "não rodou nesta janela", e as duas
coisas parecem idênticas até você checar.** Como o job só dispara uma vez
por semana, um digest diário vai ler zero na maioria dos dias por DESENHO
— isso é esperado, mesma lógica de "dia tranquilo" da seção de Incidentes.
Mas zero também é o que aparece se o launchd job parou de disparar (mesma
falha de classe que já pegou `nightly-capacity-check-trend.log`: um
mecanismo "deveria escrever isto" que ninguém nunca confirmou que escreve).
Distinga as duas checando a bead MAIS RECENTE com esse label, SEM limite de
data (`--all --limit=1` ordenado por criação, fora da janela [SINCE,UNTIL)):
se ela tem mais de ~9 dias (folga sobre o ciclo semanal de 7), reporte
explicitamente "restore-verify não roda há Nd, esperado semanal" em vez de
deixar um resultado vazio no período se disfarçar de "mais um dia tranquilo".

e) **Storage inventory (ga-z297h)** — inventário mensal leve que reusa os
comandos já listados na coluna "Medir" da Parte 0 do Atlas
(`whatsapp_automation/docs/data_dictionary.md`): `df` do Mac mini + ~10
diretórios-chave, `aws s3 ls --summarize` por bucket, quota da Drive service
account (`about.get storageQuota`), e o veredito de compute do MotherDuck
(`motherduck_invoice_usage_check.py` — Part 0's storage bytes pra MotherDuck
não tem comando de re-medição real hoje; ver o próprio script para o porquê).
Escreve um bloco delimitado logo após a tabela da Parte 0 (nunca reescreve as
células da tabela em si) e roda mensal (`com.gascity.storage-inventory-
monthly`, dia 1, 05:30) — escopado a gascity/HQ apenas, mesmo padrão do item
(d), não precisa do loop per-rig:
```bash
gc bd -C "/Users/athos/gt/.gascity-gastown-hq" list --label=storage-inventory --all --created-after=$SINCE --created-before=$UNTIL --json --limit=0
```
Mesma convenção do item (d): execução limpa fecha o bead na hora
(`type=chore`); qualquer vetor fora de ±20% da rodada anterior fica ABERTA
(`type=bug`, roteada para `gastown.dog`) — reporte esse resultado aberto em
Highlights independente de quantos outros houve.

**Mesma distinção "silêncio ≠ limpo" do item (d), com o período mensal em vez
de semanal:** o job só dispara uma vez por mês, então um digest diário ou
semanal vai ler zero na maioria das vezes por DESENHO. Checando a bead mais
recente com esse label (`--all --limit=1`, sem limite de data): se ela tem
mais de ~35 dias, reporte "storage-inventory não roda há Nd, esperado
mensal" em vez de deixar um período vazio parecer "mais um mês tranquilo".

**Why every query above needs BOTH bounds:** this formula fires on the
deacon's cooldown trigger, not a midnight cron — it can run at any
wall-clock hour. A `--created-after=$SINCE` with no `--created-before=$UNTIL`
silently extends the window from SINCE through "now", inflating every count
by whatever fraction of "today" has already elapsed. Measured impact
(ga-swvjo, 2026-08-07): the missing UNTIL bound alone inflated one day's
closed-issue count by ~40% (640 open-ended vs. 391 correctly bounded).
`--limit=0` on every `bd list --json` matters too — the default caps at 50
rows and the warning goes to stderr only; a filtered query easily clears 50
on a busy day.

**3. Collect town-level data:**

a) **Session lifecycle events** — read the event-log files directly, NOT
through `gc events` (ga-hnlog4). Every `gc events` query returns only the
NEWEST 500 matching rows and says so on stderr alone ("showing the newest 500
matching events; more history exists beyond this page" — a deliberate limit,
ga-dzshu, with no paging flag and no `--limit`). A normal day has ~1000
session events, so through the CLI the counts are a fraction of the truth:
on 2026-09-25 (ga-hnlog4) the CLI gave 81 woke / 161 stopped against 539 / 404
real — the real figures confirmed by two independent reads of the log files. Worse, `gc events ... | jq`
returns jq's exit status, so a failed call — the API's "context deadline
exceeded" under load — read as an empty result, i.e. "0 woke / 0 stopped",
indistinguishable from a quiet day. The log files
(`$GC_CITY_PATH/.gc/events.jsonl` plus the rotated
`events.jsonl.archive-<UTC stamp>-seq-<first>-<last>.gz` segments) have no
row cap, no port and no API timeout.

What the block below is built on (verified live, ga-hnlog4 / ga-swvjo):
- An archive only holds events from BEFORE its own rotation stamp (UTC, in the
  file name), so a window needs the live file plus every archive stamped at or
  after SINCE. Segments can overlap (measured live: two archives share 3 rows,
  and a rotation landing between listing and reading can show a row twice) —
  the block counts each `seq` once. A segment that is MISSING (deleted, or
  rotated out between listing and reading) shows as a hole in the chain of seq
  ranges, and the block then reports N/A instead of a low number.
- macOS `zcat` appends `.Z` to the name and fails on a `.gz` file — use
  `gzip -dc`.
- `ts` is LOCAL time (e.g. `-03:00`) while $SINCE/$UNTIL are UTC, so the
  window is applied **in epoch seconds, never by comparing the raw ts
  strings**: an event already past UNTIL in UTC can still sort as "before
  UNTIL" going purely by local wall-clock digits.
- `session.crashed` IS a real event type — rare (5 rows in the ~3 months of
  archives on disk, one of them 2026-09-26). An earlier version of this recipe
  called it non-existent, judging from a capped, current-segment-only
  `gc events` view — the same blind spot as the 500-row cap. The block counts
  it, so the digest's `crashed` figure is measured and a 0 there is a real 0.

```bash
# BEGIN session-lifecycle-counts
SINCE_EPOCH=$(date -u -d "$SINCE" +%s 2>/dev/null || date -u -j -f '%Y-%m-%dT%H:%M:%SZ' "$SINCE" +%s)
UNTIL_EPOCH=$(date -u -d "$UNTIL" +%s 2>/dev/null || date -u -j -f '%Y-%m-%dT%H:%M:%SZ' "$UNTIL" +%s)
SINCE_STAMP=$(printf '%s' "$SINCE" | tr -cd '0-9')      # 20260925000000, UTC, fixed width
[ "${#SINCE_STAMP}" -eq 14 ] || SINCE_STAMP=0            # unparseable: read every archive

JQ_EPOCH='
  def iso_offset_to_epoch:
    .[0:19] as $base
    | (if endswith("Z") then 0
       else
         (.[-6:-5]) as $sign
         | (.[-5:-3] | tonumber) as $oh
         | (.[-2:]   | tonumber) as $om
         | ($oh*3600 + $om*60) as $mag
         | (if $sign == "-" then -$mag else $mag end)
       end) as $offset_signed
    | ($base + "Z" | fromdateiso8601) - $offset_signed;
'
JQ_WINDOW_FILTER="$JQ_EPOCH"'
  select((.type == "session.woke" or .type == "session.stopped" or .type == "session.crashed")
         and (.ts | iso_offset_to_epoch) >= $since_epoch and (.ts | iso_offset_to_epoch) < $until_epoch)
'

# Segments that can hold [SINCE, UNTIL): archives stamped at/after SINCE (oldest
# first), then the live file. A name whose stamp cannot be parsed is read anyway
# — extra reading is harmless, the window filter is per row.
lifecycle_segments() (
  set -o pipefail
  find "$GC_CITY_PATH/.gc" -maxdepth 1 -name 'events.jsonl.archive-*.gz' | sort | while IFS= read -r f; do
    stamp=${f##*archive-}; stamp=$(printf '%s' "${stamp%%-seq-*}" | tr -cd '0-9')
    if [ "${#stamp}" -ne 14 ] || [ "$stamp" -ge "$SINCE_STAMP" ]; then echo "$f"; fi
  done && echo "$GC_CITY_PATH/.gc/events.jsonl"
)

# Prints {"woke":N,"stopped":M,"crashed":K}; returns 1 (reason on stderr) when the count cannot be known.
session_lifecycle_counts() (
  set -o pipefail
  for E in "$SINCE_EPOCH" "$UNTIL_EPOCH"; do
    case "$E" in ''|*[!0-9]*) echo "cannot parse SINCE/UNTIL ($SINCE / $UNTIL) into epoch seconds" >&2; return 1 ;; esac
  done
  SEGMENTS=$(lifecycle_segments) || { echo "cannot list event-log segments under $GC_CITY_PATH/.gc" >&2; return 1; }
  # The oldest segment read must reach back to SINCE, else a pruned archive hides part of the window.
  OLDEST=$(echo "$SEGMENTS" | head -n 1)
  FIRST_EPOCH=$(case "$OLDEST" in *.gz) gzip -dc -- "$OLDEST" ;; *) cat -- "$OLDEST" ;; esac 2>/dev/null | head -n 1 | jq -r "$JQ_EPOCH"' .ts | iso_offset_to_epoch' 2>/dev/null)
  if [ -z "$FIRST_EPOCH" ] || [ "$FIRST_EPOCH" -gt "$SINCE_EPOCH" ]; then
    echo "event log does not reach back to $SINCE (oldest segment $OLDEST, first event epoch '${FIRST_EPOCH:-unreadable}')" >&2
    return 1
  fi
  # A deleted MIDDLE segment, or a rotation landing between listing and reading, would undercount
  # silently while the coverage check above still passes. Each archive's name carries its seq range
  # and the live file starts where the last archive ends, so a segment that starts past the previous
  # one's end + 1 is a hole. An overlap is fine (seen live: two archives share 3 rows; the dedupe
  # below counts each seq once).
  echo "$SEGMENTS" | {
    PREV_LAST=""
    while IFS= read -r f; do
      case "$f" in
        *.gz) R=${f##*-seq-}; FIRST=${R%%-*}; LAST=${R#*-}; LAST=${LAST%.gz} ;;
        *) FIRST=$(head -n 1 -- "$f" | jq -r '.seq // empty' 2>/dev/null); LAST="" ;;
      esac
      case "$FIRST" in ''|*[!0-9]*) echo "cannot read the seq range of $f" >&2; exit 1 ;; esac
      if [ -n "$PREV_LAST" ] && [ "$FIRST" -gt $((PREV_LAST + 1)) ]; then
        echo "event log has a hole: $f starts at seq $FIRST, the previous segment ends at $PREV_LAST" >&2; exit 1
      fi
      PREV_LAST=$LAST
    done
  } || return 1
  echo "$SEGMENTS" | while IFS= read -r f; do
    case "$f" in *.gz) gzip -dc -- "$f" ;; *) cat -- "$f" ;; esac |
      jq -c --argjson since_epoch "$SINCE_EPOCH" --argjson until_epoch "$UNTIL_EPOCH" "$JQ_WINDOW_FILTER" || exit 1
  done | jq -s 'unique_by(.seq) | {woke: (map(select(.type == "session.woke")) | length), stopped: (map(select(.type == "session.stopped")) | length), crashed: (map(select(.type == "session.crashed")) | length)}'
)

WOKE_N=N/A; STOPPED_N=N/A; CRASHED_N=N/A
if COUNTS=$(session_lifecycle_counts); then
  WOKE_N=$(echo "$COUNTS" | jq -r .woke); STOPPED_N=$(echo "$COUNTS" | jq -r .stopped); CRASHED_N=$(echo "$COUNTS" | jq -r .crashed)
fi
echo "session.woke=$WOKE_N session.stopped=$STOPPED_N session.crashed=$CRASHED_N"
# END session-lifecycle-counts
```

Report the three numbers exactly as printed. **`N/A` means "could not
measure" and the digest must say N/A — never 0**: the block prints N/A (reason
on stderr) when it cannot list or read a segment, when a segment is corrupt,
when the oldest segment on disk starts after SINCE (an archive was pruned, so
part of the window is out of reach), or when the seq ranges have a hole. A `0`
is printed only when every segment was read intact, the chain of seq ranges is
unbroken, and the oldest segment reaches back to SINCE. On N/A, run the block
once more before writing N/A into the digest — two causes are transient: a torn
read of the live file's last line under load, and a rotation landing between
listing and reading (it shows up as a hole until the next listing).

b) **Escalations** — no universal `escalation` bead label exists in this city (0
hits, confirmed across 3+ independent runs, including a `--label-pattern
'*escalat*'` sweep that only found incidental substring matches). Real escalation
tracking exists only per-domain, under different label conventions — the one
confirmed-real convention is `auto-refino:escalated`. **Check every rig, not one
guessed by name:**
```bash
RIG_PATH=<rig-path>   # from `gc rig list`, one rig at a time
gc bd -C "$RIG_PATH" list --label=auto-refino:escalated --all --created-after=$SINCE --created-before=$UNTIL --json --limit=0
```
A prior version of this recipe hardcoded one rig (deacon, guessed from the
label's own "auto-refino" domain name) and produced a permanent false zero two
ways at once — both found and reproduced live, gate-failed on ga-2c2daa
(2026-08-22): (1) the deacon rig's bd database is actually empty (`gc bd -C
<deacon-rig-path> list --all --json` → `[]`) — a bead's ID prefix does not
reliably indicate which rig's database it lives in; `dc-yla3`, a real
`dc`-prefixed bead, actually lives in the gascity/HQ database, not `deacon`'s
own; (2) the query itself was missing `--all` — of 17 `auto-refino:escalated`
beads found city-wide in the same sweep, 16 were already closed, so even the
right rigs would have undercounted by ~94% without it. Sum across rigs and
report the per-rig breakdown, labeled as covering only this one confirmed
convention ("auto-refino:escalated escalations: N — no other rig has a
confirmed equivalent convention yet"), never as a bare unqualified
"Escalations: N". If any rig's query fails, say so and report N/A for that rig
rather than treating a query failure as zero.

c) **Warrants filed** — this dog pool's own `mol-shutdown-dance` warrants are not
persisted as durable beads, wisp-types, or event-types anywhere in this city —
confirmed independently across 3+ runs (0 hits via `--label=warrant --all`
across all 7 rigs, a wisp-type scan, and an event-type scan, every time). Check
anyway, every run, same as Incidents/Escalations above — the query costs
nothing even while it stays empty, and "checked and empty" is a different,
verifiable fact from "asserted empty with no way left to check":
```bash
RIG_PATH=<rig-path>   # from `gc rig list`, one rig at a time
gc bd -C "$RIG_PATH" list --label=warrant --all --created-after=$SINCE --created-before=$UNTIL --json --limit=0
```
Report **N/A — warrants are not bead-tracked in this city today**, not a bare
0, unless this query actually finds a hit — then report the real count
instead. This is the current best understanding, not a permanent fact: a
prior version of this recipe deleted the live check entirely while keeping
prose that promised a future run would still "find" a hit — an unreachable
promise with no query left to run it, gate-failed on ga-2c2daa (2026-08-22)
as the identical "settled, never recheck" shape its own Incidents/Escalations
fixes exist to eliminate. If any rig's query fails, say so and report N/A for
that rig rather than treating a query failure as zero.

d) **Disk — macOS virtual memory floor (ga-sfj3i.2)** — `/System/Volumes/VM`
(macOS swap) lives in the SAME APFS container as Dolt's data-dir, grows
monotonically within a boot, and is never reclaimed by any of
`dolt-disk-floor-guard.sh`'s four levers (kernel-managed, root-owned, and
outside the `du`-summed user tree — structurally invisible to every other
disk instrument in this city). Measure it directly (readable without sudo —
only file *contents* are root-restricted, not directory listing/size):
```bash
BOOT_EPOCH=$(sysctl -n kern.boottime | grep -oE '[0-9]+' | head -1)
NOW_EPOCH=$(date -u +%s)
UPTIME_H=$(( (NOW_EPOCH - BOOT_EPOCH) / 3600 )); [ "$UPTIME_H" -lt 1 ] && UPTIME_H=1
VM_KB=$(du -sk /System/Volumes/VM 2>/dev/null | awk '{print $1}')
DOLT_AVAIL_KB=$(df -k "$CITY/.beads/dolt" 2>/dev/null | awk 'NR==2{print $4}')
WARN_GB="${DOLT_DISK_FLOOR_WARN_GB:-8}"
```
If `VM_KB` or `DOLT_AVAIL_KB` is empty (du/df failed, or this isn't a macOS
APFS host), report **N/A — could not measure /System/Volumes/VM on this
host** for the whole subsection, not a zero. Otherwise compute and report:
```bash
VM_GB=$(( VM_KB / 1024 / 1024 ))
DOLT_AVAIL_GB=$(( DOLT_AVAIL_KB / 1024 / 1024 ))
RATE_GB_PER_H=$(awk -v vm="$VM_GB" -v h="$UPTIME_H" 'BEGIN{printf "%.2f", vm/h}')
PROJECTION=$(awk -v avail="$DOLT_AVAIL_GB" -v warn="$WARN_GB" -v rate="$RATE_GB_PER_H" 'BEGIN{
  if (rate<=0) { print "stable — no VM growth this boot" }
  else if (avail<=warn) { print "already at/below floor" }
  else { printf "~%.0fh at the average VM growth pace since boot", (avail-warn)/rate }
}')
```
Report uptime (`UPTIME_H`h since boot), `VM_GB`GB resident, and
`PROJECTION`. **Label the projection exactly as conditional** — it is VM's
OWN average growth in isolation since boot, extrapolated flat. It does
**NOT** explain or predict the city's actual ~2x/week disk-crisis cadence:
the Mayor's own follow-up on this bead (see `ga-sfj3i.2`'s comments)
falsified that broader causal claim against 40 days of the guard's own
history — total available space swings tens of GB from a separate, still-
unattributed source (see `ga-lc17m`). Report this projection as one known,
monotonic, non-recoverable-until-reboot floor consumer — never as a forecast
of the next CRITICAL event, and never propose a reboot-policy recommendation
here (explicitly suspended on `ga-sfj3i.2` until that separate oscillation is
attributed).

Close this step when all data is collected."""

[[steps]]
id = "generate-and-send"
title = "Generate digest, send to mayor, archive"
needs = ["collect-data"]
description = """
Transform data into a formatted digest and deliver it.

**1. Generate digest markdown:**

```markdown
# Gas Town {{period}} Digest: {{date}}

## Summary
- **Issues filed**: N (tasks: X, bugs: Y)
- **Issues closed**: N
- **Net change**: +/-N

## By Rig
| Rig | Filed | Closed | Commits |
|-----|-------|--------|---------|
| ... | ...   | ...    | ...     |

## Highlights
- Notable completions
- Incidents (if any)

## Agent Health
- Agents started/stopped/crashed: N/N/N
- Warrants filed: N (pardoned: X, executed: Y)

## Disk — macOS virtual memory (ga-sfj3i.2)
- Uptime: Nh (boot: <UTC timestamp>)
- VM swap resident: NGB — non-recoverable without reboot, same APFS
  container as Dolt's data-dir
- Projected time to WARN floor at the average VM growth pace since boot:
  ~NH (or "stable", or "N/A — <reason>")

## Storage — inventário mensal (ga-z297h)
- Última rodada: <data> — OK / ATENÇÃO (N vetor(es) fora de ±20% e/ou N
  vetor(es) não pôde(ram) ser medido(s) nesta rodada — as duas causas abrem
  bug e não são a mesma coisa; ver a tabela do bead para qual delas) / N/A —
  não rodou há Nd (esperado mensal)
- (quando houver rodada dentro da janela) tabela de vetores medidos, com Δ e
  status — ver o corpo do bead `storage-inventory` mais recente

## Trends
- Backlog: increasing / stable / decreasing
- Throughput: N issues/day
```

**2. Send to mayor, then verify the send immediately (ga-8h185, ga-ghxr1h):**

A prior run's close_reason cited a specific mail-bead id and "verified
assignee=gastown.mayor" — neither had happened; the send was silently
dropped. Check right now, in this same step, not later: checking later is
actively unsafe, because the mayor may archive the mail bead (an immediate
hard delete, not a close — see docs/design/mail-protocol.md) before you look
again, which makes a real send look like a false failure.

The check has THREE outcomes, not two (ga-ghxr1h): `sent`, `not-sent`,
`unknown`. `gc events` is an HTTP call to the city API and it fails under
load (`context deadline exceeded`, seen at load average 61-77 on
2026-09-26). A query that FAILED — or printed anything that is not a list of
`mail.sent` event rows (an error message, an error envelope, a changed
shape) — says nothing about the mail: that is `unknown`, never `not-sent`.
Only a query that ran to completion, returned well-formed rows (an empty
list is well-formed), and found none for THIS digest (this subject,
addressed to the mayor) is `not-sent`. The distinction is not
cosmetic: the action on `not-sent` is a second send, a mail cannot be
unsent, and re-sending on a failed query delivers the digest twice. (Do not
pipe `gc events` into anything either — the pipe reports the LAST command's
exit status and hides a failed query, which is how this bug started.)

Run the send and the check as ONE command — the resend needs the same subject
and body, and the check is up to two `gc events` calls of about 10s each at
load 40, so give the command a couple of minutes. Read the event rows with
`printf '%s'`, never `echo`: zsh's `echo` rewrites the backslash escapes that
mail bodies carry inside the event JSON, and the parse then fails.
```bash
SEND_SUBJECT="Gas Town Digest: $DATE"
check_mail_sent() {   # prints: sent | not-sent | unknown
  local ev try
  for try in 1 2; do
    ev=$(gc events --since=5m --type=mail.sent 2>/dev/null) || { sleep 5; continue; }
    printf '%s' "$ev" | jq -e -s --arg s "$SEND_SUBJECT" 'if all(.[]; type == "object" and .type == "mail.sent") then any(.[]; .payload.message.subject == $s and ((.payload.message.to // "") | endswith("mayor"))) else error("not mail.sent event rows") end' >/dev/null 2>&1
    case $? in
      0) echo sent; return ;;        # well-formed rows, and one is this digest addressed to the mayor
      1) echo not-sent; return ;;    # well-formed rows (or none at all), and none is this digest
    esac                             # any other jq status: not event rows / unreadable, try again
    sleep 5
  done
  echo unknown
}
gc mail send mayor/ -s "$SEND_SUBJECT" -m "$DIGEST"
MAIL_CHECK=$(check_mail_sent)
if [ "$MAIL_CHECK" = "not-sent" ]; then   # ONLY a completed check that found nothing
  gc mail send mayor/ -s "$SEND_SUBJECT" -m "$DIGEST"
  MAIL_CHECK=$(check_mail_sent)
fi
echo "MAIL_CHECK=$MAIL_CHECK"
```

What the verdict means for step 4's close_reason. Never send a third time,
and never assert delivery the check did not confirm:
- `sent`: the digest is confirmed delivered.
- `not-sent`: even the one resend did not show up in `gc events`. Say so
  plainly in step 4's close_reason instead of asserting delivery.
- `unknown`: `gc events` could not be checked (it failed, or returned
  unreadable output, on both tries). The digest may well have been
  delivered — do NOT send it again. Say so plainly in step 4's close_reason
  ("send not verified: gc events failed twice"), instead of asserting
  delivery or claiming it failed.

**3. Archive as bead — CLOSED, and NEVER type task/bug/chore:**

A digest is an informational artifact covering one specific day. Once
that day is over there is no pending action, so it must never enter
the Pilot dispatch queue or the panel's Aprovadas column (both select
on issue_type task/bug/chore). Archive as `message` and close it in
the same breath — do not leave it open "for visibility"; closed beads
remain fully findable via `bd show`/`bd list --all --include-infra`
(`message` is an infra type — plain `bd list`, even with `--all`, hides it;
confirmed live 2026-08-13, ga-4tt37: 774 open message-type beads invisible
without `--include-infra`).

Stamp the covered window as metadata, not just in the title (ga-c6yys3,
2026-09-14) — determine-period's next run reads `digest.until` back from
whichever digest bead this query finds most recent, to anchor the next
SINCE without ever touching wall-clock time. Without this, a future
change to the title format would silently break that lookup with no
error, just a quiet fall-back to the old skip/duplicate-prone behavior.

The JSON is built by `jq --arg`, not typed with backslash-escaped quotes
(ga-hnlog4): this text is a TOML string, which consumes one level of backslash
before the agent ever reads it, so a hand-escaped `--metadata` argument reached
the agent with bare quotes inside quotes — the shell stripped them and
`--metadata` received `{digest.since:2026-...,digest.until:2026-...}`, which is
not JSON. Nothing here depends on how many escape layers sit between the source
and the agent, and a value can never break the quoting.
```bash
DIGEST_META=$(jq -cn --arg since "$SINCE" --arg until "$UNTIL" '{"digest.since":$since,"digest.until":$until}')
DIGEST_ID=$(gc bd create --type=message \
  --title="Digest: $DATE" \
  --label=digest,{{period}} \
  --metadata "$DIGEST_META" \
  --silent)
gc bd close "$DIGEST_ID" --reason "Daily digest archived — informational artifact, no action pending"
```

**Verify before claiming success anywhere (ga-4tt37).** This exact
create+close pair has silently produced `issue_type=task`, left OPEN, on
at least 3 separate runs — root cause unconfirmed (the executing step may
not literally send `--type=message`, or something else reverts it), but
every miss shared the same signature: the work bead's close_reason still
asserted "archived as $DIGEST_ID" as if it had succeeded, and the wrong
type meant `digest-sweep`'s daily backstop (which fixes `status` only,
never `issue_type`) closed it late without ever correcting the type. Check,
and self-correct once, before trusting the commands above worked:
```bash
V_TYPE=$(gc bd show "$DIGEST_ID" --json | jq -r '.[0].issue_type')
V_STATUS=$(gc bd show "$DIGEST_ID" --json | jq -r '.[0].status')
if [ "$V_TYPE" != "message" ] || [ "$V_STATUS" != "closed" ]; then
  gc bd update "$DIGEST_ID" -t message
  gc bd close "$DIGEST_ID" --reason "Daily digest archived — informational artifact, no action pending" 2>/dev/null || true
  V_TYPE=$(gc bd show "$DIGEST_ID" --json | jq -r '.[0].issue_type')
  V_STATUS=$(gc bd show "$DIGEST_ID" --json | jq -r '.[0].status')
fi
```
If `$V_TYPE`/`$V_STATUS` still aren't `message`/`closed` after that retry,
do NOT write a close_reason in step 4 claiming the digest was archived —
comment the actual state (`gc bd comment <work-bead> "..."`) and word the
close_reason honestly instead. A close_reason that asserts a success it
never checked is worse than no close_reason (ga-8h185: the sibling
false-verification bug, same step, the mail-send sub-action above).

**3b. Promote the digest to a permanent bead — the reaper purges ephemeral
wisps, and a `message`-typed bead is ephemeral by default on this install
(ga-cke56):**

`$DIGEST_ID` above is still an ephemeral wisp at this point even though its
type/status are now correct — `issue_type=message` defaults to ephemeral
storage here (confirmed: no `storage-class.message` override in city
config, so this is bd's own built-in per-type default, and passing
`--storage-class versioned` on the original create call does NOT bypass
it — confirmed empirically, don't re-try that path). Left alone,
`mol-dog-reaper` purges it once it's been closed past `purge_age` — i.e.
"archived as a digest bead" would keep being untrue even with the
type/status fix above. Promote on the already-verified `$DIGEST_ID`:

```bash
gc bd promote "$DIGEST_ID" --reason "digest archive must survive wisp purge (ga-cke56)"
```

**Verify before claiming success (same discipline as 3 above) — a promoted
bead keeps its original `wisp-`-shaped id forever, so check the `ephemeral`
field, never the id shape. Three real outcomes here, not two: `bd show`
prints the literal text `null` for a confirmed-durable bead (not a missing
key — verified live), `true` for confirmed-still-ephemeral, and an EMPTY
string only when the show/jq call itself failed (bad id, Dolt hiccup) — an
empty result is "couldn't check," never treat it the same as `null`
("checked, and it's durable"):**
```bash
V_EPHEMERAL=$(gc bd show "$DIGEST_ID" --json 2>/dev/null | jq -r '.[0].ephemeral' 2>/dev/null)
if [ "$V_EPHEMERAL" = "true" ]; then
  gc bd promote "$DIGEST_ID" --reason "digest archive must survive wisp purge (ga-cke56), retry" 2>/dev/null || true
  V_EPHEMERAL=$(gc bd show "$DIGEST_ID" --json 2>/dev/null | jq -r '.[0].ephemeral' 2>/dev/null)
fi
```
If `$V_EPHEMERAL` is not exactly `null` after that retry (still `true`, or
empty because the check itself failed), do NOT claim the digest was
durably archived in step 4's close_reason — comment the actual state on
the work bead instead, same rule as the mail-send and type/status checks
above: an unchecked success claim is worse than an honest gap.

**4. Close work bead, signal reconciler, and exit:**
```bash
gc bd close <work-bead> --reason "Digest generated and sent"
gc runtime drain-ack
exit
```
Only use that exact close_reason if the verifications in steps 2 (that is,
`MAIL_CHECK=sent`), 3, and 3b all actually passed. If any didn't, replace it
with an honest account of what's still wrong — the work bead closing is
about this step's own lifecycle, not a certificate that the digest was
delivered.

The deacon records this run via a `type:order-run` bead for cooldown
tracking on the next patrol cycle."""
