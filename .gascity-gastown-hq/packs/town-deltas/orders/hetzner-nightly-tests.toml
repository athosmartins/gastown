# ga-9p6pte: a bateria completa de testes do WhatsApp roda toda madrugada no nó Hetzner, sem rede de saída e sem segredos, e o Mayor recebe o relatório de manhã.
#
# ARMADILHA DO CRON (medida em 27/08, ver engine-window-reboot-noon.toml): o cron destes orders é avaliado em UTC, não na hora local. "Por volta
# de 02:00" local (-03) = 05:00 UTC, por isso `0 5 * * *`. O Brasil não tem horário de verão desde 2019; se voltar, este horário muda junto.
#
# O QUE FAZ: hetzner-nightly-tests.sh busca origin/main do WA, empurra a árvore filtrada para o nó e roda a suíte em LOTES de arquivos
# (um pytest novo por lote, cada um sob teto de memória de cgroup e `-n` derivado do MemAvailable: ga-84gkpab) DENTRO do helper de
# isolamento de rede (mbp-run.sh com HETZNER_ISOLATE=1). Sem o helper de root instalado (docs/runbooks/hetzner-nightly-tests.md) a bateria NÃO roda:
# o veredito da noite é INERTE e o relatório diz o que falta. Nunca se roda a suíte sem a prova do canário (04/10: um teste de branch antiga mandou
# e-mail de verdade).
#
# timeout 13800s (3h50) > o fim do próprio script: o script para pelo MENOR de HZN_TIMEOUT_S=13500 contado do início e HZN_STOP_UTC=08:45 (relógio UTC), e ainda reserva 300 s para o relatório,
# então registra o desfecho antes do kill da ordem. A ordem começa 05:00Z (a janela vai até 08:55Z, o hetzner-node-reseed, que reinstala o venv do nó se o freeze mudou: uma noite que passasse dessa hora o
# pegaria no meio). O relógio, e não só o prazo contado do início, é o que garante isso quando a ordem nasce atrasada (24/11: o script começou ~05:06Z).
# Janela real para os lotes: 05:00Z → 08:40Z = ~13200 s (era 12300 s com o prazo fixo de 12600 s). Medido: 22/11 11706 s, 23/11 12276 s, 24/11 ~14000 s projetados para 11 lotes (nó mais lento); quando não couber,
# o relatório diz o ritmo e o orçamento, e compara os lotes que rodaram (comparação PARCIAL, ga-z6bc623). Mudou o orçamento? Confira esta conta e a do reseed.
# PISTAS (ga-282sl1d): até HZN_LANES (2) lotes rodam ao mesmo tempo no nó (cada um um gt-iso-run --lanes N, com orçamento de memória e piso de CPU próprios): a conta acima é a de UMA pista; com duas, a noite de 24/11 (~14000 s sequenciais)
# deve caber folgada. A 1ª noite com pistas diz o ganho real na linha `pistas:` do relatório. Desligar: HZN_LANES=1.
# o script tem trava de instância única, então uma rodada que passe da hora não empilha com a seguinte.
#
# Conferir depois de um reload:  gc order show hetzner-nightly-tests          -> Source: .../packs/town-deltas/...
#                                tail -3 $GC_CITY_PATH/.gc/logs/hetzner-nightly.jsonl   (um veredito por noite)
[order]
description = "Madrugada (02:00 local): pytest completo do WhatsApp no nó Hetzner, sem rede e sem segredos, com relatório ao Mayor (ga-9p6pte)"
trigger = "cron"
schedule = "0 5 * * *"
exec = "bash $PACK_DIR/../../scripts/hetzner-nightly-tests.sh"
timeout = "13800s"
