# ga-2hd02v.5.6.4: dá DONO aos mutantes que o item hq-mutants do lastro do nó Hetzner confirma como SOBREVIVENTES. O hq-mutants quebra um trecho do código do hq por vez (hq-mutate.py, na jaula) e vê se o selftest
# reprova; o que sobrevive a duas rodadas (a 2ª numa cópia limpa) é teste que não protege aquela linha, e o motor o guarda em ~/gt-remote/ballast/hq-mutants.state.json. Sem esta order ninguém lê esse arquivo e o
# item seria queima disfarçada: gasta CPU e não produz nada que alguém leia.
#
# O QUE FAZ: hetzner-ballast-newfail.py --fonte hq-mutants lê o estado do motor no nó (ssh) e mantém UMA bead no rig do HQ (a cidade; task, P3, labels origem:lastro-hq-mutants e area:testes) com a lista COMPLETA
# de sobreviventes (arquivo, linha, troca, id, selftest da família): abre quando a lista é nova, comenta quando ela muda ou zera ("pegos": o selftest foi reforçado e o arquivo, varrido de novo, não tem mais o
# sobrevivente), abre outra se o dono fechou a anterior E a lista mudou depois. ANTES de abrir lista o rig (label origem:lastro-hq-mutants): se já existe uma nossa não fechada, comenta nela em vez de abrir outra.
# Ler o nó ou o estado local que falha = exit 3 e NADA é aberto; o nó desligado (falta .gc/hetzner-node.on) = não faz nada. Estado local: .gc/hetzner-ballast/newfail-hq-mutants.json (o do wa-suite é outro arquivo).
#
# 30 min como a do wa-suite: a lista é o estado ATUAL (não um evento) e o motor só a muda quando varre um arquivo; cada volta custa um ssh e, se a lista mudou, um bd na cidade.
# timeout 420s: a volta que ABRE bead empilha ssh (até 60 s) + show (até 60 s) + list (até 90 s) + create (até 90 s) = 300 s só nos tetos, e 420 s dá folga.
#
# Conferir depois de um reload:  gc order show hetzner-hq-mutants-newfail   -> Source: .../packs/town-deltas/...
#                                cat $GC_CITY_PATH/.gc/hetzner-ballast/newfail-hq-mutants.json   (a lista que já foi avisada e a bead)
[order]
description = "Cada 30 min: a lista COMPLETA dos mutantes que o hq-mutants do lastro (nó Hetzner) confirmou como sobreviventes vira UMA bead no rig do HQ (abre / comenta quando muda / comenta quando zera); no-op com o nó desligado (ga-2hd02v.5.6.4)"
trigger = "cooldown"
interval = "30m"
timeout = "420s"
exec = "python3 -I $PACK_DIR/../../scripts/hetzner-ballast-newfail.py --fonte hq-mutants"
