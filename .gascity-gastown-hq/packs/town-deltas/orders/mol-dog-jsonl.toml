# town-deltas override (ga-gtrc8n): script vendored into town-deltas/assets so
# $PACK_DIR resolves here (the embedded maintenance copy is gitignored/
# ephemeral) — same recipe as gate-sweep's, mol-dog-backup's (ga-gquc1), and
# mol-dog-doctor's (ga-3wdlv/ga-v6y3p) overrides. The vendored script adds
# ensure_archive_pack_config(), which bounds git-maintenance's pack-objects
# memory/CPU on the jsonl-archive repo (measured 3.2GB RSS unbounded vs. 514MB
# bounded) and applies it on every run so the bound survives the archive repo
# being deleted and recreated — see the vendored script's own header comment
# for the full rationale. dolt-target.sh is vendored unchanged alongside it
# (same directory) purely so $SCRIPT_DIR-relative sourcing keeps resolving
# from this new location; its Dolt-connection logic is untouched.
[order]
description = "Export Dolt databases to JSONL git archive"
exec = "$PACK_DIR/assets/scripts/jsonl-export.sh"
trigger = "cooldown"
interval = "15m"
