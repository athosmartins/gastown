# ga-a3ar7h: keep the jsonl-archive git repos compacted, by BYTES.
#
# mol-dog-jsonl commits a fresh 41MB hq.jsonl (+ 10-20MB whatsapp_automation.jsonl) many times a
# day; measured 2026-09-26, that is 45MiB of loose objects per commit (~243MiB/h), against
# 67-189KB per commit once packed. Git's own post-commit auto-maintenance decides by sampling ONE
# directory (objects/17) of the loose-object COUNT, so it stayed silent while
# packs/maintenance/jsonl-archive/.git grew to 5.3GiB of loose objects (0.5GiB packed for the
# same 11k commits) and pushed the boot disk to its 2GB floor. The town's
# git-maintenance-runner does not list these repos and skips below 10GB free.
#
# This order packs loose objects in bounded batches once they pass 256MiB, merges the small
# packs those batches leave into ONE pack when they hold >= 256MiB (ga-3sf9r8: `repack -f` over
# just those packs, so the per-batch first copies of a giant file collapse; the big old pack is
# never touched), and runs one consolidating gc when packs pile up (>= 8). It never shortens
# history — the S3 mirror copies only the working tree, so the git history has no offsite
# copy. Full rationale, the alarm rule and the failure states: header of
# assets/scripts/jsonl-archive-compact.sh.
#
# interval 30m: at ~243MiB/h of new loose blobs the 256MiB limit is crossed about hourly; 30m
# bounds how long a crossing goes unnoticed.
#
# timeout 21900s (6h05m, ga-wkoij7): by day the script ends itself at its own 780s deadline and logs its
# outcome, long before any kill. The long timeout is for the NIGHT: inside the repack window
# (00:00-06:00, Athos 15/10) the consolidating gc is not held to 600s — that cap killed it three runs
# in a row on the 6.5GB archive, and a killed gc keeps nothing — it gets the time left until 06:00
# (less 5 min), so the longest a run can last is the window (6h) plus its cleanup. Outside the
# window nothing changes. The ticks that fire every 30m while such a gc runs do not stack: the
# script's single-flight lock answers them "in flight" at once (exit 0), and the lock records the
# run's end time so a gc older than the lock's 90-minute stale age is not taken from it.
# selftest S11 fails if the timeout stops covering the script's deadline and the window, or if the
# interval passes 1h.
#
# ga-ft1iv6: on a disk at the floor (the mini lives at 3-4.7GB free) the tail pass used to answer skipped-low-disk forever, so every backup's ~200MB seed pack stayed (1.4GB/day) and the disk stayed at the floor.
# It now has a tight-disk road ("2a-tight" in the script header): a smaller pass, lean and under a disk/swap watchdog. JAC_TAIL_TIGHT=0 in this order's environment turns it off.
#
# Only ONE instance exists (this pack's orders register for the city scope); the script is
# single-flight anyway.
#
# Verify after a reload:  gc order show jsonl-archive-compact   -> Source: .../town-deltas/...
#                         bash $GC_CITY_PATH/packs/town-deltas/assets/scripts/jsonl-archive-compact.sh --check
#                         tail -3 $GC_CITY_PATH/.gc/logs/jsonl-archive-compact.log
[order]
description = "Compact the jsonl-archive git repos by bytes — git's auto-gc counts objects and never fires on multi-MB blobs (5GiB/day of loose hq.jsonl copies)"
trigger = "cooldown"
interval = "30m"
timeout = "21900s"
exec = "$PACK_DIR/assets/scripts/jsonl-archive-compact.sh"
