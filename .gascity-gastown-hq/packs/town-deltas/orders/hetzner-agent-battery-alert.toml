# ga-hyp55ss.4: a queda da taxa da bateria de agentes avisa o Mayor e marca o merge que mudou a configuração do papel. As ordens da fatia 3 medem (noite e gatilho de merge) e gravam uma linha por rodada em $GC_CITY_PATH/.gc/logs/agent-battery.jsonl;
# esta compara cada linha NOVA com a mediana das últimas noites do mesmo acervo, e uma queda que a sorte não explica vira e-mail ao Mayor (gc mail send) e o rótulo audit:bateria-queda, com comentário, nas beads dos commits que tocaram a configuração do papel
# entre as duas medições (.claude/, CLAUDE.md, <cidade>/CLAUDE.md, prompt do papel). Só mede e avisa: não bloqueia merge.
#
# 20 min: o que ela lê é o jsonl, que só muda quando uma rodada termina (uma por noite e uma por merge de configuração), então olhar mais devagar não perde nada; cada volta lê um arquivo e, só quando avisa, roda um git e alguns bd.
# timeout 1500s: o pior caso é 3 papéis em queda (git 30+60 s cada) + e-mail (120 s) + até 5 beads com rótulo e comentário (2 x 60 s cada); a volta seguinte conta do fim desta.
# Sem alerta repetido: uma linha que pede aviso só é dada como vista depois do e-mail; a mesma configuração ainda baixa na noite seguinte não avisa de novo (alert-state.json). A 1a volta só grava a base. O controle negativo NÃO é desta ordem: roda à mão,
# `python3 -I scripts/agent-battery-alert.py control`, porque gasta tokens de verdade (docs/runbooks/agent-battery-alert.md).
#
# Conferir depois de um reload:  gc order show hetzner-agent-battery-alert   -> Source: .../packs/town-deltas/...
#                                tail -n 3 $GC_CITY_PATH/.gc/logs/agent-battery-alert.jsonl   (uma linha por papel avaliado: kind, taxa, base, p)
[order]
description = "A cada 20 min: a taxa por papel da bateria de agentes (nó Hetzner) é comparada com a mediana das últimas noites do mesmo acervo; queda que não é sorte avisa o Mayor e marca (audit:bateria-queda) as beads dos commits que mexeram na configuração do papel (ga-hyp55ss.4)"
trigger = "cooldown"
interval = "20m"
exec = "python3 -I $PACK_DIR/../../scripts/agent-battery-alert.py sweep"
timeout = "1500s"
