# ga-mw5gdyu.4: resumo semanal da auto-melhoria ao Athos (épico «Recusas → checagens»), segunda 08:00 local: 3 a 5 linhas em português por notify + mail ao Mayor. Só relata: lê o medidor da .1, o registro e as beads da .2 e as confs da .3, e não escreve nada deles.
#
# CRON IS UTC (see engine-window-reboot-noon.toml): 11:00 UTC = 08:00 local (-03), o primeiro minuto depois da janela de silêncio 00h-08h. O próprio script recusa enviar dentro da janela (uma rodada adiada NÃO se repete: rode à mão depois das 08h).
# Duas rodadas do medidor (esta semana e a anterior) leem o log do gate e o comentário de cada recusa: minutos sob carga, por isso 1800s.
#
# Conferir depois de um reload:  gc order show auto-melhoria-weekly   -> Source: .../town-deltas/...
#                                python3 -I $GC_CITY_PATH/scripts/auto-melhoria-weekly.py      (o mesmo texto, na tela, sem enviar nada)
[order]
description = "Semanal (segunda 08:00 local): resumo da auto-melhoria ao Athos — 1ª tentativa semana x semana anterior, classes recusadas, checagens pedidas/em teste/promovidas/desligadas; notify + mail ao Mayor, nunca dentro da janela de silêncio (ga-mw5gdyu.4)"
trigger = "cron"
schedule = "0 11 * * 1"
timeout = "1800s"
exec = "python3 -I $PACK_DIR/../../scripts/auto-melhoria-weekly.py --apply"
