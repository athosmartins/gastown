# ga-7sxdmb: replaces the maintenance pack's `mol-dog-jsonl`, which city.toml now switches off
# with `[orders] skip`. Same trigger and interval as the builtin.
#
# Why a NEW name + skip, and not the same-name override this pack used to carry
# (ga-gtrc8n, ga-fxrrav): a same-name override only shadows the CITY-scoped instance. The
# maintenance pack also registers `mol-dog-jsonl` once PER RIG (`gc order list` showed 6
# instances: city + gastown, lexbh, marketing, property_scrapers, whatsapp_automation), and
# those five kept running the builtin script — the one WITHOUT the ga-fxrrav guard — into the
# shared packs/maintenance/jsonl-archive. On 2026-09-26 that committed truncated exports as
# the snapshot (WA 5423 -> 505 rows, hq 14821 -> 10880), the next complete export read as
# growth, and the Mayor got "JSONL spike detected [HIGH]" mails (WA 3430 -> 505 -> 5425).
# That archive is what the nightly scripts/dolt-s3-backup.sh (~04:00) mirrors to S3, so a
# truncated snapshot sitting there at sync time would go offsite.
# Same trap ga-5mu653 hit with wisp-compact and ga-aijm2v.5 with nudge-on-route (see the
# comment above `[orders]` in city.toml).
#
# One city-scoped instance is enough: the script exports EVERY user database found by
# SHOW DATABASES, whichever rig's order fired it (nothing in it reads GC_RIG), so the five
# rig instances were the same export five more times — concurrent full exports of ~60 MB
# into one working tree, extra load on a Dolt that hands back truncated results under load
# (ga-fxrrav).
#
# Script vendored into town-deltas/assets so $PACK_DIR resolves here (the embedded
# maintenance copy is gitignored/ephemeral). It carries ensure_archive_pack_config()
# (ga-gtrc8n: bounds git-maintenance's pack-objects memory/CPU on the archive repo —
# measured 3.2GB RSS unbounded vs. 514MB bounded), the short-export guard (ga-fxrrav) and the
# source-count partial-export gate (ga-7sxdmb). dolt-target.sh is vendored unchanged alongside
# it so $SCRIPT_DIR-relative sourcing keeps resolving from this location.
#
# The archive stays at packs/maintenance/jsonl-archive — the path scripts/dolt-s3-backup.sh
# mirrors offsite and scripts/dolt-gc-maintenance.sh archives pruned rows into (when
# enabled) — via the script's own
# default, NOT via GC_PACK_STATE_DIR (which gc points at packs/town-deltas for this order).
# The old packs/town-deltas/jsonl-archive is no longer written; it is left in place.
#
# ga-48e0du: `timeout` is declared. An exec order that names none gets the engine default of 300 s
# (orders.Order.TimeoutOrDefault — see mol-dog-reaper.toml, ga-x2fj8h), and this script commits ONCE, after
# every database has been exported. A run killed before that leaves the files written and nothing committed:
# on 2026-10-16 the archive HEAD froze at 12:08:15Z while eight runs in a row ended `exec-failed` at 5m02s-5m06s
# (`gc order history jsonl-export`; the last run that finished took 4m07s — the ceiling was already 82% used),
# so the committed snapshot stayed 8 h old, and the working tree the S3 mirror copies was a mix of files from
# different killed runs (hq 20:04Z, whatsapp_automation 19:08Z). The data did not grow (hq/issues.jsonl
# 71.39 -> 71.97 MB across that window); the host load did (84 on 10 cores at the time of the fix), and the
# time is not Dolt alone: in the 20:00Z run, from the file mtimes, the `jq` scrub of that 72 MB file took ~80 s
# and the `jq` validate + flat copy right after it ~67 s. A run now needs about 6-8 minutes — an ESTIMATE from
# those mtimes, not a stopwatch run.
#
# 840 s = 14 min: about twice that estimate, and deliberately UNDER the 15 m interval. The script has no
# single-flight lock of its own (the compactor has one; this exporter takes none), so a timeout above the
# interval would let the next tick start a second export in the same git working tree — the concurrent-export
# failure of ga-fxrrav. If a run ever needs more than 14 min, give the script a lock FIRST, then raise this.
#
# ga-j2f5v5: the order still fires every 15 min whatever the disk; the SCRIPT decides whether that tick exports. With the free disk under 5 GB it exports at most once an hour, and in Dolt's CRITICAL class
# (free GiB, rounded down, <= 3) only when the last export is more than 3 h old; a disk it cannot read, or a missing/garbled last_export_at, means it exports. A skipped tick exits 0, asks Dolt nothing and
# writes `skipped-low-disk (cadência estendida)` to .gc/logs/jsonl-export.log — so a `gc order history jsonl-export` full of runs does not mean a full of exports. 3 h + this interval + this timeout stays
# under the 6 h "fonte parada" alarm of jsonl-hourly-offsite.sh (jsonl-export.selftest.sh compares them).
# jsonl-export.selftest.sh (ga-48e0du) fails if `timeout` is missing, under 600 s, or not under `interval`.
#
# ga-iqsy9c7: this timeout is a SIGKILL — the script's trap never runs — so a run that does not fit in it leaves no end of its own. The script writes `start pid=N` and `end rc=N` to .gc/logs/jsonl-export.log
# (a start with no end is a run that died); the NEXT run logs `DIED ... N in a row`, deletes the scratch of the dead pid (names carry it: $table.jsonl.tmp.p<pid>.*) before it asks Dolt anything, and tells the deacon
# at the 3rd death in a row. The 4 h age sweep stays only as the net for a scratch name that carries no pid.
#
# ga-80oz1l9: the "6-8 minutes" above is from before the supplemental tables (ga-l6v576), which read hq.comments (437 MB) and the other tables page by page. At load 55-65 on 10 cores a run took 1711 s (a hand-run
# without a timeout): every scheduled run from 07:42Z to ~15:48Z died at 840 s, nothing was committed and the offsite lagged 6 h. The pager now parses a page once, copies it by bytes instead of taking it apart and
# putting it back (19 MB page: 2.6 s of CPU -> 0.15 s) and asks for bigger pages where the rows are small (hq.labels, row read: 169 s -> 43 s at load 64). A whole run was NOT timed after that — the timeout stays 840 s,
# under the interval — so whether three runs in a row end inside it is for `gc order history jsonl-export` to say once this is deployed.
#
# ga-fegzc8h: it was NOT enough, and the number that mattered was never the speed of one database. Three scheduled runs on 28/10 (03:09Z, 03:39Z, 04:02Z) each died at 840 s and committed nothing; the offsite stood
# still from 20:04Z of 27/10. A whole run measured by hand at load 70-122: beads 21 s, dc 21 s, gastown 33 s, hq 528 s (its comments 233 s; the scrub, validate, count and copy after the tables ~190 s), lexbh 112 s,
# marketing 17 s, property_scrapers 48 s, whatsapp_automation ~180 s — ~960 s, longer than this timeout, and the script still committed ONCE, after the last database. Making a database faster moves that sum by a
# fraction; no timeout under the interval can hold it when the load goes up again. So the script now fits ITS WORK in a budget (GC_JSONL_BUDGET_SECONDS, 690 s) and commits what is complete:
#   - it starts the database that was started LONGEST AGO first (state: db_runs.<db>.tried), so a database that was killed or deferred goes to the front of the next run, and one that was killed mid-export goes to the back;
#   - a database starts only if its last measured cost x 125 % fits in what is left of the budget (a database never measured counts 240 s); the first database of a run always starts, so a run always makes progress;
#   - past budget - 200 s it reads no further supplemental table: the previous version stays, as for a table Dolt cut short (`partial=db(table)` in the commit subject);
#   - what it did not start is NAMED, as `deferred=a,b` in the commit subject, `deferred: a b` in the summary and the DOG_DONE nudge, and `DEFER db — why` in the log. It is not `partial=` (that one makes
#     jsonl_hourly.py count a stale table and alert) and not `failed:` (it did not fail; it waited). The archive's HEAD moves every run, and the age of each database's issues.jsonl — what the offsite checks (6 h) — is
#     bounded by the number of runs it takes to come round: 2-3 at the costs above, i.e. 30-45 min — an ESTIMATE from those costs, not a measurement of a deployed run.
# 690 s + 120 s for the commit and the git housekeeping that follows it = 810 s, under this 840 s. jsonl-export-budget.selftest.sh fails if the default budget + 120 s is over `timeout`, if `timeout` is not under
# `interval`, or if the exporter does not rotate, defer, cut the tables off and commit. The timeout is NOT raised: the script still has no single-flight lock. That three runs in a row end with a commit, and that
# `jsonl-hourly-offsite-age` returns to 0 (latest.json younger than 4500 s), can only be said by `gc order history jsonl-export` and the log after this is deployed.
[order]
description = "Export Dolt databases to JSONL git archive (ga-7sxdmb — replaces mol-dog-jsonl)"
exec = "$PACK_DIR/assets/scripts/jsonl-export.sh"
trigger = "cooldown"
interval = "15m"
timeout = "840s"
